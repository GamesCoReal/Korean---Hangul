<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hangul Quest</title>

<style>
:root{
  --bg:#f7f7f9;
  --card:#ffffff;
  --ink:#17171a;
  --muted:#73747d;
  --line:#e5e5ea;
  --accent:#111827;
  --good:#16803c;
  --bad:#d92d20;
  --soft:#f0f0f4;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;
  min-height:100svh;
}

button,input{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

.app{
  max-width:640px;
  margin:auto;
  padding:
    env(safe-area-inset-top)
    17px
    calc(25px + env(safe-area-inset-bottom));
}

header{
  padding:18px 3px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.headerLeft{
  min-width:0;
}

h1{
  font-size:29px;
  letter-spacing:-.7px;
  margin:0;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.headerButtons{
  display:flex;
  gap:7px;
  align-items:center;
  flex:none;
}

.iconbtn,
.langbtn{
  border:0;
  border-radius:13px;
  padding:10px 12px;
}

.iconbtn{
  background:var(--soft);
}

.langbtn{
  background:var(--accent);
  color:#fff;
  font-size:12px;
  font-weight:800;
}

nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin:8px 0 14px;
}

nav button{
  border:0;
  background:transparent;
  border-radius:13px;
  padding:10px 3px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

nav button.active{
  background:var(--accent);
  color:#fff;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 6px 25px #00000008;
}

.hero{
  padding:24px 20px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

h2{
  font-size:24px;
  margin:5px 0 7px;
  letter-spacing:-.4px;
}

p{
  line-height:1.45;
}

.coursebar{
  margin-top:18px;
  background:var(--soft);
  border-radius:15px;
  padding:12px;
}

.coursebarTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  font-weight:750;
}

.progress{
  height:7px;
  background:#e8e8ed;
  border-radius:99px;
  overflow:hidden;
  margin:9px 0 2px;
}

.progress div{
  height:100%;
  background:var(--accent);
  width:0;
  transition:.25s;
}

.lesson-list{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.lesson{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:14px;
}

.lesson.locked{
  opacity:.5;
}

.num{
  width:40px;
  height:40px;
  border-radius:14px;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-weight:800;
  flex:none;
}

.lesson b{
  display:block;
}

.lesson small{
  color:var(--muted);
}

.xp{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.primary{
  width:100%;
  border:0;
  background:var(--accent);
  color:white;
  border-radius:16px;
  padding:15px;
  font-weight:750;
  margin-top:10px;
}

.secondary{
  border:1px solid var(--line);
  background:white;
  border-radius:14px;
  padding:12px 14px;
  font-weight:700;
}

.glyph{
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:100px;
  text-align:center;
  line-height:1.05;
  padding:13px 0;
}

.prompt{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.answers{
  display:grid;
  gap:9px;
  margin-top:13px;
}

.answer{
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:15px;
  text-align:left;
  font-size:17px;
  font-weight:700;
  min-height:56px;
}

.answer.correct{
  border-color:var(--good);
  background:#effaf2;
  color:var(--good);
}

.answer.wrong{
  border-color:var(--bad);
  background:#fff1ef;
  color:var(--bad);
}

.feedback{
  text-align:center;
  font-weight:750;
  min-height:24px;
  margin:12px 0 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
}

.stat b{
  font-size:19px;
  display:block;
}

.stat span{
  font-size:10px;
  color:var(--muted);
}

.sectionGap{
  margin-top:14px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px;
}

.choices button{
  min-height:76px;
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:17px;
  font-weight:750;
  font-size:20px;
}

.builder{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  min-height:92px;
  border:1px dashed #cfcfd5;
  border-radius:18px;
  font-size:52px;
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

.slot{
  width:72px;
  height:72px;
  border:2px dashed #ccc;
  border-radius:15px;
  display:grid;
  place-items:center;
}

.writeCard{
  overflow:hidden;
}

.writeGlyph{
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:100px;
  text-align:center;
  line-height:1;
  margin:4px 0 10px;
}

.writeInstructions{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.canvasWrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  max-width:420px;
  margin:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  touch-action:none;
}

#guide{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:.13;
}

#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.writeScore{
  text-align:center;
  font-size:28px;
  font-weight:850;
  margin-top:14px;
  min-height:34px;
}

.scoreHint{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  min-height:18px;
}

.writeButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.writeButtons button{
  margin:0;
}

.writeFeedback{
  text-align:center;
  min-height:25px;
  margin-top:10px;
  font-weight:750;
}

.wordHero{
  text-align:center;
}

.wordKorean{
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:64px;
  font-weight:800;
  margin:16px 0 4px;
}

.wordMeaning{
  color:var(--muted);
  font-size:16px;
  margin-bottom:15px;
}

.wordInput{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:14px;
  font-size:19px;
  text-align:center;
  outline:none;
}

.wordInput:focus{
  border-color:#999;
}

.wordStatus{
  min-height:25px;
  text-align:center;
  margin-top:10px;
  font-weight:750;
}

.wordAttempts{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  min-height:18px;
}

.calendarHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.calendarHeader button{
  border:0;
  background:var(--soft);
  border-radius:12px;
  width:38px;
  height:38px;
}

.calendarTitle{
  font-weight:800;
  text-align:center;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  padding:4px 0;
}

.day{
  position:relative;
  min-height:42px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:12px;
}

.day.empty{
  border-color:transparent;
  background:transparent;
}

.day.future{
  opacity:.3;
}

.day.selected{
  outline:2px solid var(--accent);
  outline-offset:-2px;
}

.mark{
  position:absolute;
  right:4px;
  bottom:3px;
  font-size:9px;
  font-weight:900;
}

.mark.green{
  color:var(--good);
}

.mark.yellow{
  color:#b77900;
}

.mark.red{
  color:var(--bad);
}

.mark.mix-yellow{
  color:#b77900;
}

.mark.mix-red-yellow{
  color:var(--bad);
}

.calendarHint{
  color:var(--muted);
  font-size:12px;
  margin:12px 0 0;
}

.reviewList{
  display:grid;
  gap:8px;
  margin-top:14px;
}

.reviewItem{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:12px;
}

.reviewGlyph{
  width:48px;
  font-size:30px;
  text-align:center;
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

.reviewInfo{
  flex:1;
}

.reviewInfo b{
  display:block;
}

.reviewInfo small{
  color:var(--muted);
}

.emptyReview{
  text-align:center;
  color:var(--muted);
  padding:20px 5px;
}

@media(max-width:400px){
  h1{font-size:26px}
  .glyph{font-size:88px}
  .writeGlyph{font-size:88px}
  .wordKorean{font-size:56px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="headerLeft">
    <h1>Hangul Quest</h1>
    <div class="sub" id="subtitle"></div>
  </div>

  <div class="headerButtons">
    <button class="iconbtn" id="sound" aria-label="Sound">🔊</button>
    <button class="langbtn" id="language"></button>
  </div>
</header>

<nav id="nav">
  <button data-view="home" class="active"></button>
  <button data-view="practice"></button>
  <button data-view="write"></button>
  <button data-view="word"></button>
  <button data-view="review"></button>
</nav>

<!-- HOME -->
<section class="view active" id="home">
  <div class="card hero">
    <div class="eyebrow" id="courseEyebrow"></div>
    <h2 id="homeTitle"></h2>
    <p id="homeDescription"></p>

    <div class="coursebar">
      <div class="coursebarTop">
        <span id="courseText"></span>
        <span id="coursePercent">0%</span>
      </div>
      <div class="progress">
        <div id="courseProgress"></div>
      </div>
    </div>
  </div>

  <div class="lesson-list" id="lessons"></div>
</section>

<!-- PRACTICE -->
<section class="view" id="practice">

  <div class="card">
    <div class="eyebrow" id="lessonPracticeLabel"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px">
      <b id="qnum"></b>
      <span id="qmode" style="font-size:11px;color:var(--muted)"></span>
    </div>

    <div class="progress">
      <div id="qbar"></div>
    </div>

    <div class="prompt" id="prompt"></div>
    <div class="glyph" id="big"></div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <b id="correctStat">0</b>
      <span id="correctLabel"></span>
    </div>

    <div class="stat">
      <b id="streakStat">0</b>
      <span id="streakLabel"></span>
    </div>

    <div class="stat">
      <b id="accuracyStat">0%</b>
      <span id="accuracyLabel"></span>
    </div>
  </div>

  <div class="card sectionGap">
    <div class="eyebrow" id="builderEyebrow"></div>
    <h2 id="builderTitle"></h2>

    <div class="builder" id="builder"></div>
    <div class="choices" id="buildChoices"></div>
    <div class="feedback" id="buildFeedback"></div>
  </div>

</section>

<!-- WRITE -->
<section class="view" id="write">

  <div class="card writeCard">
    <div class="eyebrow" id="writingLabel"></div>

    <div class="writeGlyph" id="writeGlyph"></div>

    <div class="writeInstructions" id="writeInstructions"></div>

    <div class="canvasWrap">
      <canvas id="guide"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>

    <div class="writeScore" id="writeScore"></div>
    <div class="scoreHint" id="scoreHint"></div>

    <div class="writeButtons">
      <button class="secondary" id="erase"></button>
      <button class="primary" id="checkWrite"></button>
    </div>

    <button class="secondary" id="newWrite" style="width:100%;margin-top:9px"></button>

    <div class="writeFeedback" id="writeFeedback"></div>
  </div>

</section>

<!-- WORD -->
<section class="view" id="word">

  <div class="card wordHero">
    <div class="eyebrow" id="wordEyebrow"></div>
    <h2 id="wordTitle"></h2>

    <div id="wordDate"></div>
    <div class="wordKorean" id="wordKorean"></div>
    <div class="wordMeaning" id="wordMeaning"></div>

    <input
      id="wordInput"
      class="wordInput"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
    >

    <button class="primary" id="wordCheck"></button>

    <div class="wordStatus" id="wordStatus"></div>
    <div class="wordAttempts" id="wordAttempts"></div>
  </div>

  <div class="card sectionGap">
    <div class="calendarHeader">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div class="calendarTitle" id="calendarTitle"></div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>

    <div class="calendar" id="calendar"></div>
    <p class="calendarHint" id="calendarHint"></p>
  </div>

</section>

<!-- REVIEW -->
<section class="view" id="review">

  <div class="card">
    <div class="eyebrow" id="reviewEyebrow"></div>
    <h2 id="reviewTitle"></h2>
    <p id="reviewDescription"></p>

    <div class="reviewList" id="reviewList"></div>

    <button class="primary" id="startReview"></button>
  </div>

</section>

</div>

function shuffle(a){
  return [...a].sort(()=>Math.random()-.5);
}

function getMastery(key){
  s.mastery[key] ??= {
    correct:0,
    wrong:0,
    next:0
  };

  s.mastery[key].correct ??= 0;
  s.mastery[key].wrong ??= 0;
  s.mastery[key].next ??= 0;

  return s.mastery[key];
}

function updateMastery(key,ok){
  const m=getMastery(key);

  if(ok){
    m.correct++;
  }else{
    m.wrong++;
  }

  save();
}

function masteredCount(){
  return all.filter(x=>getMastery(x[0]).correct>=2).length;
}

function soundLabel(item){
  return language==="ko"
    ? (koSounds[item[0]] || item[1])
    : item[1];

function renderLessons(){

  const box=$("lessons");
  box.innerHTML="";

  units.forEach((u,i)=>{

    const unlocked=i<s.unlocked;
    const mastered=u.items.every(x=>getMastery(x[0]).correct>=2);

    const btn=document.createElement("button");
    btn.className="lesson"+(unlocked?"":" locked");
    btn.disabled=!unlocked;

    btn.innerHTML=`
      <div class="num">${unlocked ? i+1 : "🔒"}</div>
      <div style="min-width:0;flex:1">
        <b>${language==="ko"?u.ko:u.name}</b>
        <small>${language==="ko"?u.koDesc:u.desc}</small>
      </div>
      <div class="xp">${mastered ? "✓" : unlocked ? "▶" : ""}</div>
    `;

    btn.addEventListener("click",()=>{
      if(unlocked){
        startLesson(i);
      }
    });

    box.appendChild(btn);
  });

  const total=all.length;
  const mastered=masteredCount();
  const percent=total ? Math.round(mastered/total*100) : 0;

  $("courseProgress").style.width=percent+"%";
  $("coursePercent").textContent=percent+"%";
}

function startLesson(index){

  clearTimeout(answerTimer);
  answerTimer=null;

  activeUnit=index;
  q=0;
  locked=false;
  current=null;
  lastAnswerCorrect=null;
  lastAnswerRight="";

  setView("practice");
  newQuestion();
}

/* =========================================================
   PRACTICE
========================================================= */

function newQuestion(){

  locked=false;
  lastAnswerCorrect=null;
  lastAnswerRight="";

  const pool=units[activeUnit].items;

  const item=pool[Math.floor(Math.random()*pool.length)];

  const mode=Math.random()<.5 ? "sound" : "letter";

  current={
    item,
    mode
  };

  renderCurrentQuestion();
}

function renderCurrentQuestion(){

  if(!current)return;

  const item=current.item;

  $("qnum").textContent=`${q+1} / ${qTotal}`;

  $("qbar").style.width=(q/qTotal*100)+"%";

  $("qmode").textContent=
    current.mode==="sound"
      ? T("questionSound")
      : T("questionLetter");

  if(current.mode==="sound"){
    $("prompt").textContent=
      item[0].length===1 || activeUnit<4
        ? T("questionSound")
        : T("questionRead");

    $("big").textContent=item[0];
  }else{
    $("prompt").textContent=T("questionLetter");
    $("big").textContent=soundLabel(item);
  }

  const wrongPool=shuffle(
    units[activeUnit].items.filter(x=>x[0]!==item[0])
  ).slice(0,3);

  let choices;

  if(current.mode==="sound"){
    choices=[
      soundLabel(item),
      ...wrongPool.map(x=>soundLabel(x))
    ];
  }else{
    choices=[
      item[0],
      ...wrongPool.map(x=>x[0])
    ];
  }

  choices=shuffle(choices);

  const box=$("answers");
  box.innerHTML="";

  choices.forEach(choice=>{

    const b=document.createElement("button");
    b.className="answer";
    b.textContent=choice;

    b.addEventListener("click",()=>{
      answer(b,choice);
    });

    box.appendChild(b);
  });

  $("feedback").textContent="";
}

function answer(button,choice){

  if(locked || !current)return;

  locked=true;

  const item=current.item;

  const right=
    current.mode==="sound"
      ? soundLabel(item)
      : item[0];

  const ok=choice===right;

  lastAnswerCorrect=ok;
  lastAnswerRight=right;

  document.querySelectorAll("#answers .answer").forEach(b=>{
    b.disabled=true;

    if(b.textContent===right){
      b.classList.add("correct");
    }
  });

  if(!ok){
    button.classList.add("wrong");
  }

  if(ok){
    s.correct++;
    s.total++;
    s.streak++;

    updateMastery(item[0],true);

    $("feedback").textContent=
      T("correctFeedback")+" "+T("nextComing");
  }else{
    s.total++;
    s.streak=0;

    updateMastery(item[0],false);

    $("feedback").textContent=
      `${T("answerLabel")}: ${right} • ${T("nextComing")}`;
  }

  save();
  stats();
  updateMasteryDisplay();

  clearTimeout(answerTimer);

  answerTimer=setTimeout(()=>{

    answerTimer=null;
    q++;

    if(q>=qTotal){

      if(activeUnit===s.unlocked && s.unlocked<units.length){
        s.unlocked++;
      }

      save();
      renderLessons();

      current=null;
      locked=false;

      setView("home");

    }else{
      newQuestion();
    }

  },1250);
}

function stats(){

  $("correctStat").textContent=s.correct;
  $("streakStat").textContent=s.streak;

  const accuracy=s.total
    ? Math.round(s.correct/s.total*100)
    : 0;

  $("accuracyStat").textContent=accuracy+"%";
}

function updateMasteryDisplay(){

  /* Keeps the home progress synchronized */
  renderLessons();
}

function build(){

  const consonants=["ㄱ","ㄴ","ㄷ","ㅁ","ㅂ","ㅅ"];
  const vowels=["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"];

  const c=consonants[Math.floor(Math.random()*consonants.length)];
  const v=vowels[Math.floor(Math.random()*vowels.length)];

  const syllableMap={
    "ㄱㅏ":"가",
    "ㄱㅓ":"거",
    "ㄱㅗ":"고",
    "ㄱㅜ":"구",
    "ㄱㅡ":"그",
    "ㄱㅣ":"기",

    "ㄴㅏ":"나",
    "ㄴㅓ":"너",
    "ㄴㅗ":"노",
    "ㄴㅜ":"누",
    "ㄴㅡ":"느",
    "ㄴㅣ":"니",

    "ㄷㅏ":"다",
    "ㄷㅓ":"더",
    "ㄷㅗ":"도",
    "ㄷㅜ":"두",
    "ㄷㅡ":"드",
    "ㄷㅣ":"디",

    "ㅁㅏ":"마",
    "ㅁㅓ":"머",
    "ㅁㅗ":"모",
    "ㅁㅜ":"무",
    "ㅁㅡ":"므",
    "ㅁㅣ":"미",

    "ㅂㅏ":"바",
    "ㅂㅓ":"버",
    "ㅂㅗ":"보",
    "ㅂㅜ":"부",
    "ㅂㅡ":"브",
    "ㅂㅣ":"비",

    "ㅅㅏ":"사",
    "ㅅㅓ":"서",
    "ㅅㅗ":"소",
    "ㅅㅜ":"수",
    "ㅅㅡ":"스",
    "ㅅㅣ":"시"
  };

  builderTarget={
    c,
    v,
    answer:syllableMap[c+v]
  };

  builderStep=0;

  $("builder").innerHTML=`
    <div class="slot" id="slotC">${c}</div>
    <div class="slot" id="slotV">${v}</div>
  `;

  makeBuilderChoices();

  $("buildFeedback").textContent="";
  updateBuilderLanguage();
}

function updateBuilderLanguage(){

  if(!builderTarget)return;

  const target=builderTarget;

  if(builderStep===0){
    $("builderTitle").textContent=
      `${T("builderBuild")} ${target.answer}`;
  }else if(builderStep===1){
    $("builderTitle").textContent=
      `${T("builderBuild")} ${target.answer}`;
  }else{
    $("builderTitle").textContent=
      `${T("builderComplete")} ${target.answer}`;
  }
}

function makeBuilderChoices(){

  const choices=[
    builderTarget.c,
    builderTarget.v
  ];

  const extraConsonants=["ㄱ","ㄴ","ㄷ","ㅁ","ㅂ","ㅅ","ㅎ"];
  const extraVowels=["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ","ㅔ"];

  if(builderStep===0){
    while(choices.length<4){
      const x=extraConsonants[
        Math.floor(Math.random()*extraConsonants.length)
      ];

      if(!choices.includes(x))choices.push(x);
    }
  }else{
    while(choices.length<4){
      const x=extraVowels[
        Math.floor(Math.random()*extraVowels.length)
      ];

      if(!choices.includes(x))choices.push(x);
    }
  }

  const box=$("buildChoices");
  box.innerHTML="";

  shuffle(choices).forEach(choice=>{

    const b=document.createElement("button");
    b.textContent=choice;

    b.addEventListener("click",()=>{

      if(builderStep===0){

        if(choice===builderTarget.c){
          $("slotC").textContent=choice;
          builderStep=1;
          $("buildFeedback").textContent="✓";
          makeBuilderChoices();
          updateBuilderLanguage();
        }else{
          $("buildFeedback").textContent=T("builderTryAgain");
        }

      }else{

        if(choice===builderTarget.v){

          $("slotV").textContent=choice;
          builderStep=2;

          $("buildFeedback").textContent=T("builderCorrect");
          updateBuilderLanguage();

          setTimeout(build,1000);

        }else{
          $("buildFeedback").textContent=T("builderTryAgain");
        }
      }
    });

    box.appendChild(b);
  });
}

const drawCanvas=$("drawCanvas");
const guideCanvas=$("guide");

const dctx=drawCanvas.getContext("2d");
const gctx=guideCanvas.getContext("2d");

let drawing=false;
let hasInk=false;

const writeItems=[
  "ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ",
  "ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ",
  "ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ",
  "ㅠ","ㅡ","ㅣ","ㅐ","ㅔ",
  "가","나","다","마","바","사",
  "너","미","고","아","우","하"
];

function resizeCanvases(){

  const rect=drawCanvas.parentElement.getBoundingClientRect();

  const dpr=Math.min(window.devicePixelRatio||1,2);

  drawCanvas.width=Math.round(rect.width*dpr);
  drawCanvas.height=Math.round(rect.height*dpr);

  guideCanvas.width=Math.round(rect.width*dpr);
  guideCanvas.height=Math.round(rect.height*dpr);

  dctx.setTransform(dpr,0,0,dpr,0,0);
  gctx.setTransform(dpr,0,0,dpr,0,0);

  drawGuide();
}

function drawGuide(){

  const rect=drawCanvas.parentElement.getBoundingClientRect();

  gctx.clearRect(0,0,rect.width,rect.height);

  gctx.font=
    `${Math.min(rect.width*.72,300)}px "Apple SD Gothic Neo","Noto Sans KR",sans-serif`;

  gctx.textAlign="center";
  gctx.textBaseline="middle";
  gctx.fillText(
    writeItems[wi],
    rect.width/2,
    rect.height/2
  );
}

function clearCanvas(){

  const rect=drawCanvas.parentElement.getBoundingClientRect();

  dctx.clearRect(0,0,rect.width,rect.height);
  hasInk=false;

  $("writeScore").textContent="";
  $("writeFeedback").textContent="";
}

function writeNew(){

  clearTimeout(writeTimer);
  writeTimer=null;
  writeLocked=false;

  $("writeGlyph").textContent=writeItems[wi];

  clearCanvas();

  resizeCanvases();
}

function getPoint(e){

  const rect=drawCanvas.getBoundingClientRect();

  const source=e.touches ? e.touches[0] : e;

  return {
    x:source.clientX-rect.left,
    y:source.clientY-rect.top
  };
}

function startDrawing(e){

  e.preventDefault();

  if(writeLocked)return;

  drawing=true;
  hasInk=true;

  const p=getPoint(e);

  dctx.beginPath();
  dctx.moveTo(p.x,p.y);
}

function draw(e){

  if(!drawing || writeLocked)return;

  e.preventDefault();

  const p=getPoint(e);

  dctx.lineTo(p.x,p.y);
  dctx.lineWidth=7;
  dctx.lineCap="round";
  dctx.lineJoin="round";
  dctx.stroke();
}

function stopDrawing(){

  if(!drawing)return;

  drawing=false;
}

drawCanvas.addEventListener("mousedown",startDrawing);
drawCanvas.addEventListener("mousemove",draw);
window.addEventListener("mouseup",stopDrawing);

drawCanvas.addEventListener("touchstart",startDrawing,{passive:false});
drawCanvas.addEventListener("touchmove",draw,{passive:false});
drawCanvas.addEventListener("touchend",stopDrawing);

function calculateWritingScore(){

  if(writeLocked)return;

  if(!hasInk){
    $("writeFeedback").textContent=T("writingNoInk");
    return;
  }

  writeLocked=true;

  /*
    Forgiving score:
    We compare the user's ink pixels with the guide's glyph area.
    This intentionally isn't strict handwriting recognition.
  */

  const w=drawCanvas.width;
  const h=drawCanvas.height;

  const userData=dctx.getImageData(0,0,w,h).data;
  const guideData=gctx.getImageData(0,0,w,h).data;

  let userCount=0;
  let guideCount=0;
  let overlap=0;

  for(let i=3;i<userData.length;i+=4){

    const u=userData[i]>20;
    const g=guideData[i]>10;

    if(u)userCount++;
    if(g)guideCount++;
    if(u && g)overlap++;
  }

  let score=0;

  if(userCount>0 && guideCount>0){

    const precision=overlap/userCount;
    const coverage=overlap/guideCount;

    score=Math.round(
      Math.min(
        100,
        (precision*.45 + coverage*.55)*100
      )
    );
  }

  score=Math.max(0,Math.min(100,score));

  $("writeScore").textContent=score+"%";

  if(score>=80){
    $("writeFeedback").textContent=T("writingExcellent");
  }else if(score>=55){
    $("writeFeedback").textContent=T("writingGood");
  }else{
    $("writeFeedback").textContent=T("writingKeep");
  }

  clearTimeout(writeTimer);

  /*
    IMPORTANT:
    Regardless of whether the score is good or bad,
    automatically advance after exactly 1.25 seconds.
  */

  writeTimer=setTimeout(()=>{

    writeTimer=null;
    wi=(wi+1)%writeItems.length;

    writeNew();

  },1250);
}

$("checkWrite").addEventListener("click",calculateWritingScore);

$("erase").addEventListener("click",()=>{

  clearTimeout(writeTimer);
  writeTimer=null;
  writeLocked=false;

  clearCanvas();

});

$("newWrite").addEventListener("click",()=>{

  wi=(wi+1)%writeItems.length;
  writeNew();

});

window.addEventListener("resize",()=>{
  resizeCanvases();
});

function dateKey(date){

  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function wordIndexForDate(key){

  const start=new Date("2026-01-01T00:00:00");
  const date=new Date(key+"T00:00:00");

  const diff=Math.floor(
    (date-start)/(1000*60*60*24)
  );

  return ((diff%wordData.length)+wordData.length)%wordData.length;
}

function dayState(key){
  return s.wordDays[key] || null;
}

function renderWord(){

  if(!selectedDateKey){
    selectedDateKey=dateKey(new Date());
  }

  const todayKey=dateKey(new Date());

  const selected=new Date(selectedDateKey+"T00:00:00");
  const today=new Date(todayKey+"T00:00:00");

  if(selected>today){
    selectedDateKey=todayKey;
  }

  const index=wordIndexForDate(selectedDateKey);
  const w=wordData[index];

  $("wordDate").textContent=
    selected.toLocaleDateString(
      language==="ko" ? "ko-KR" : "en-US",
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  $("wordKorean").textContent=w[0];

  $("wordMeaning").textContent=
    language==="ko" ? w[2] : w[1];

  $("wordInput").placeholder=T("wordInputPlaceholder");

  const state=dayState(selectedDateKey);

  const tries=state?.tries || 0;
  const finished=!!(
    state &&
    (
      state.correct ||
      tries>=3
    )
  );

  $("wordInput").disabled=finished;
  $("wordCheck").disabled=finished;

  if(state?.correct){

    $("wordStatus").textContent=T("wordCorrect");

  }else if(tries>=3){

    $("wordStatus").textContent=T("wordFailed");

  }else if(tries>0){

    const remaining=3-tries;

    $("wordStatus").textContent=
      `${T("wordWrong")} ${T("wordTryAgain")}`;

  }else{

    $("wordStatus").textContent="";
  }

  if(tries>0){

    const remaining=3-tries;

    $("wordAttempts").textContent=
      `${T("wordAttemptsLabel")}: ${tries}/3`+
      (
        remaining>0
          ? ` • ${remaining} ${T("wordAttemptsLeft")}`
          : ""
      );

  }else{

    $("wordAttempts").textContent=
      `${T("wordAttemptsLabel")}: 0/3`;
  }

  renderCalendar();
}

function checkWord(){

  const typed=$("wordInput").value.trim();
  const key=selectedDateKey;

  const existing=dayState(key);

  if(
    existing &&
    (
      existing.correct ||
      (existing.tries||0)>=3
    )
  ){
    return;
  }

  if(!typed){

    $("wordStatus").textContent=T("wordTypeFirst");
    return;
  }

  const index=wordIndexForDate(key);
  const answer=wordData[index][0];

  const state=existing || {
    tries:0,
    correct:false
  };

  state.tries++;

  if(typed===answer){

    state.correct=true;
    s.wordDays[key]=state;

    save();

    $("wordStatus").textContent=T("wordCorrect");
    $("wordAttempts").textContent=
      `${T("wordAttemptsLabel")}: ${state.tries}/3`;

    $("wordInput").disabled=true;
    $("wordCheck").disabled=true;

  }else{

    state.correct=false;
    s.wordDays[key]=state;

    save();

    if(state.tries>=3){

      $("wordStatus").textContent=T("wordFailed");

      $("wordInput").disabled=true;
      $("wordCheck").disabled=true;

    }else{

      const remaining=3-state.tries;

      $("wordStatus").textContent=
        `${T("wordWrong")} ${T("wordTryAgain")}`;

      $("wordAttempts").textContent=
        `${T("wordAttemptsLabel")}: ${state.tries}/3 • `+
        `${remaining} ${T("wordAttemptsLeft")}`;

      /*
        Keep the input active after a wrong answer.
        The user gets all 3 attempts.
      */

      $("wordInput").value="";
      $("wordInput").focus();
    }
  }

  renderCalendar();
}

$("wordCheck").addEventListener("click",checkWord);

$("wordInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    checkWord();
  }
});

/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  $("calendarTitle").textContent=
    calendarDate.toLocaleDateString(
      language==="ko" ? "ko-KR" : "en-US",
      {
        month:"long",
        year:"numeric"
      }
    );

  const box=$("calendar");
  box.innerHTML="";

  const weekdays=language==="ko"
    ? ["일","월","화","수","목","금","토"]
    : ["S","M","T","W","T","F","S"];

  weekdays.forEach(day=>{

    const el=document.createElement("div");
    el.className="weekday";
    el.textContent=day;

    box.appendChild(el);
  });

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  for(let i=0;i<first.getDay();i++){

    const empty=document.createElement("div");
    empty.className="day empty";

    box.appendChild(empty);
  }

  const todayKey=dateKey(new Date());

  for(let day=1;day<=last.getDate();day++){

    const d=new Date(year,month,day);
    const key=dateKey(d);

    const el=document.createElement("button");
    el.className="day";
    el.textContent=day;

    if(key>todayKey){
      el.classList.add("future");
      el.disabled=true;
    }

    if(key===selectedDateKey){
      el.classList.add("selected");
    }

    const state=dayState(key);

    if(state){

      const mark=document.createElement("span");
      mark.className="mark";

      const tries=state.tries||0;

      if(state.correct){

        mark.textContent="✓";

        if(tries===1){
          mark.classList.add("green");
        }else if(tries===2){
          mark.classList.add("mix-yellow");
        }else{
          mark.classList.add("mix-red-yellow");
        }

      }else{

        mark.textContent="✕";

        if(tries===1){
          mark.classList.add("yellow");
        }else if(tries===2){
          mark.classList.add("mix-red-yellow");
        }else{
          mark.classList.add("red");
        }
      }

      el.appendChild(mark);
    }

    el.addEventListener("click",()=>{

      selectedDateKey=key;

      renderWord();

      $("wordInput").value="";

    });

    box.appendChild(el);
  }
}

$("prevMonth").addEventListener("click",()=>{

  calendarDate.setMonth(calendarDate.getMonth()-1);
  renderCalendar();

});

$("nextMonth").addEventListener("click",()=>{

  const next=new Date(
    calendarDate.getFullYear(),
    calendarDate.getMonth()+1,
    1
  );

  const today=new Date();

  if(
    next.getFullYear()>today.getFullYear() ||
    (
      next.getFullYear()===today.getFullYear() &&
      next.getMonth()>today.getMonth()
    )
  ){
    return;
  }

  calendarDate=next;
  renderCalendar();

});

/* =========================================================
   REVIEW
========================================================= */

function renderReview(){

  const box=$("reviewList");
  box.innerHTML="";

  const now=Date.now();

  const due=all
    .filter(item=>{
      const m=getMastery(item[0]);

      return (
        m.wrong>0 ||
        m.correct<2 ||
        (m.next && m.next<=now)
      );
    })
    .sort((a,b)=>{

      const ma=getMastery(a[0]);
      const mb=getMastery(b[0]);

      if(ma.correct!==mb.correct){
        return ma.correct-mb.correct;
      }

      return mb.wrong-ma.wrong;
    })
    .slice(0,10);

  if(!due.length){

    box.innerHTML=`
      <div class="emptyReview">
        ${T("nothingUrgent")}
      </div>
    `;

    return;
  }

  due.forEach(item=>{

    const m=getMastery(item[0]);

    const el=document.createElement("div");
    el.className="reviewItem";

    el.innerHTML=`
      <div class="reviewGlyph">${item[0]}</div>

      <div class="reviewInfo">
        <b>${soundLabel(item)}</b>
        <small>
          ${m.correct} ${T("reviewCorrect")}
          •
          ${m.wrong} ${T("reviewMissed")}
        </small>
      </div>
    `;

    box.appendChild(el);
  });
}

$("startReview").addEventListener("click",()=>{

  const now=Date.now();

  const due=all.filter(item=>{

    const m=getMastery(item[0]);

    return (
      m.wrong>0 ||
      m.correct<2 ||
      (m.next && m.next<=now)
    );
  });

  if(!due.length){
    setView("review");
    return;
  }

  activeUnit=due[0].unit;

  q=0;
  current=null;

  setView("practice");
  newQuestion();

});

========================================================= */

$("sound").addEventListener("click",()=>{

  if(!current)return;

  const text=
    current.mode==="sound"
      ? soundLabel(current.item)
      : current.item[0];

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const utter=new SpeechSynthesisUtterance(text);

    utter.lang="ko-KR";
    utter.rate=.75;

    speechSynthesis.speak(utter);
  }

});

selectedDateKey=dateKey(new Date());
