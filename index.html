<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">

<title>Hangul Quest</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#111111;
    --secondary:#777;
    --border:#dedee3;
    --accent:#007aff;
    --green:#34c759;
    --red:#ff3b30;
    --yellow:#ffcc00;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "SF Pro Text",Arial,sans-serif;
}

button{
    font:inherit;
}

.app{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:18px 16px 35px;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

h1{
    margin:0;
    font-size:28px;
    font-weight:800;
}

.langButton{
    border:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 13px;
    font-weight:700;
}

nav{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-bottom:18px;
}

nav button{
    border:0;
    background:#e5e5ea;
    border-radius:12px;
    padding:10px 4px;
    font-size:12px;
    font-weight:700;
}

nav button.active{
    background:var(--text);
    color:white;
}

section{
    display:none;
}

section.active{
    display:block;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.035);
}

.hero{
    text-align:center;
    padding:28px 20px;
}

.hero h2{
    margin:0 0 8px;
    font-size:24px;
}

.muted{
    color:var(--secondary);
}

.progressOuter{
    height:10px;
    background:#e5e5ea;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.progressInner{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:.25s;
}

.lesson{
    display:flex;
    align-items:center;
    gap:13px;
}

.lessonNumber{
    width:45px;
    height:45px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e5e5ea;
    font-weight:800;
    flex-shrink:0;
}

.lessonInfo{
    flex:1;
}

.lessonInfo strong{
    display:block;
    margin-bottom:4px;
}

.lessonInfo small{
    color:var(--secondary);
}

.lesson button{
    border:0;
    background:var(--accent);
    color:white;
    border-radius:12px;
    padding:9px 12px;
    font-weight:700;
}

.lesson button.locked{
    background:#e5e5ea;
    color:#999;
}

.stageBadge{
    display:inline-block;
    background:#eaf2ff;
    color:var(--accent);
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
}

.stageTitle{
    margin:0 0 5px;
    font-size:22px;
}

.stageDescription{
    margin:0;
    color:var(--secondary);
}

.questionCard{
    text-align:center;
}

.questionMode{
    color:var(--secondary);
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
}

.bigLetter{
    font-size:100px;
    line-height:1.05;
    margin:10px 0 22px;
    font-weight:500;
}

.answers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.answer{
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:16px;
    padding:15px 10px;
    font-size:20px;
    font-weight:700;
    min-height:58px;
}

.answer:active{
    transform:scale(.98);
}

.answer.correct{
    background:#dff7e5;
    border-color:var(--green);
}

.answer.wrong{
    background:#ffe1df;
    border-color:var(--red);
}

.feedback{
    min-height:25px;
    margin-top:13px;
    font-weight:800;
}

.feedback.good{
    color:var(--green);
}

.feedback.bad{
    color:var(--red);
}

.progressText{
    text-align:center;
    font-size:14px;
    color:var(--secondary);
    margin-top:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#f5f5f7;
    border-radius:15px;
    padding:12px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:20px;
}

.stat small{
    color:var(--secondary);
}

.builderCard{
    display:none;
}

.builderTarget{
    text-align:center;
    font-size:52px;
    margin:12px 0 18px;
}

.builderSlots{
    display:grid;
    grid-template-columns:1fr 30px 1fr;
    gap:8px;
    align-items:center;
    margin-bottom:16px;
}

.builderSlot{
    min-height:65px;
    border:2px dashed var(--border);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:700;
}

.builderPlus{
    text-align:center;
    color:var(--secondary);
    font-weight:800;
}

.builderChoices{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.buildChoice{
    min-height:55px;
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:14px;
    font-size:22px;
    font-weight:700;
}

.buildChoice.correct{
    background:#dff7e5;
    border-color:var(--green);
}

.buildChoice.wrong{
    background:#ffe1df;
    border-color:var(--red);
}

.buildInstruction{
    text-align:center;
    color:var(--secondary);
    margin-bottom:8px;
    font-weight:700;
}

.testResult{
    text-align:center;
    display:none;
}

.testScore{
    font-size:58px;
    font-weight:900;
    margin:10px 0;
}

.writeCard{
    text-align:center;
}

#drawCanvas{
    width:100%;
    max-width:600px;
    aspect-ratio:1;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    touch-action:none;
}

#guideCanvas{
    display:none;
}

.writeWord{
    font-size:72px;
    margin:5px 0 10px;
}

.writeButtons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.primary,
.secondaryButton{
    flex:1;
    border:0;
    border-radius:14px;
    padding:14px;
    font-weight:800;
}

.primary{
    background:var(--accent);
    color:white;
}

.secondaryButton{
    background:#e5e5ea;
}

.writeResult{
    min-height:27px;
    margin-top:10px;
    font-weight:800;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.day{
    aspect-ratio:1;
    border-radius:9px;
    background:#e5e5ea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:700;
}

.day.done{
    background:#34c759;
    color:white;
}

.day.partial{
    background:#ffcc00;
}

.wordBig{
    font-size:72px;
    text-align:center;
    margin:10px 0;
}

.wordMeaning{
    text-align:center;
    font-size:18px;
}

.wordAttempts{
    text-align:center;
    color:var(--secondary);
    margin:10px;
}

.reviewItem{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.reviewLetter{
    font-size:30px;
    width:60px;
}

.reviewBar{
    flex:1;
    height:8px;
    background:#e5e5ea;
    border-radius:20px;
    overflow:hidden;
    margin:0 12px;
}

.reviewFill{
    height:100%;
    background:var(--accent);
}

@media(max-width:500px){
    .bigLetter{
        font-size:80px;
    }

    .builderChoices{
        grid-template-columns:repeat(4,1fr);
    }

    .writeWord{
        font-size:60px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>Hangul Quest</h1>
    <button class="langButton" id="languageButton" onclick="toggleLanguage()">
        한국어
    </button>
</header>

<nav id="nav">
    <button data-view="home" onclick="setView('home')">Learn</button>
    <button data-view="practice" onclick="setView('practice')">Practice</button>
    <button data-view="write" onclick="setView('write')">Write</button>
    <button data-view="word" onclick="setView('word')">Word</button>
    <button data-view="review" onclick="setView('review')">Review</button>
</nav>

<!-- HOME -->

<section id="home">

    <div class="card hero">
        <h2 id="homeTitle">Learn Hangul step by step</h2>
        <p class="muted" id="homeSubtitle">
            Master each lesson before moving to the next.
        </p>

        <div class="progressOuter">
            <div class="progressInner" id="courseProgress"></div>
        </div>

        <p class="muted" id="courseProgressText"></p>
    </div>

    <div id="lessonList"></div>

</section>


<!-- PRACTICE -->

<section id="practice">

    <div class="card">
        <div class="stageBadge" id="stageBadge">Stage 1 of 4</div>
        <h2 class="stageTitle" id="stageTitle"></h2>
        <p class="stageDescription" id="stageDescription"></p>
    </div>

    <div class="card questionCard" id="questionCard">

        <div class="questionMode" id="questionMode"></div>

        <div class="bigLetter" id="bigLetter"></div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <div class="progressText" id="practiceProgress"></div>

    </div>


    <div class="card builderCard" id="builderCard">

        <div class="buildInstruction" id="buildInstruction"></div>

        <div class="builderTarget" id="builderTarget">?</div>

        <div class="builderSlots">
            <div class="builderSlot" id="builderSlot1">?</div>
            <div class="builderPlus">+</div>
            <div class="builderSlot" id="builderSlot2">?</div>
        </div>

        <div class="builderChoices" id="builderChoices"></div>

        <div class="feedback" id="buildFeedback"></div>

        <div class="progressText" id="buildProgress"></div>

    </div>


    <div class="card testResult" id="testResult">
        <div class="stageBadge" id="testResultBadge"></div>
        <div class="testScore" id="testScore"></div>
        <p id="testResultText"></p>
    </div>


    <div class="card stats">
        <div class="stat">
            <strong id="statCorrect">0</strong>
            <small id="statCorrectLabel">Correct</small>
        </div>

        <div class="stat">
            <strong id="statWrong">0</strong>
            <small id="statWrongLabel">Wrong</small>
        </div>

        <div class="stat">
            <strong id="statAccuracy">0%</strong>
            <small id="statAccuracyLabel">Accuracy</small>
        </div>
    </div>

</section>


<!-- WRITE -->

<section id="write">

    <div class="card writeCard">

        <div class="stageBadge" id="writeBadge">Writing Practice</div>

        <div class="writeWord" id="writeWord">가</div>

        <p class="muted" id="writeInstruction">
            Trace the character.
        </p>

        <canvas id="guideCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>

        <div class="writeButtons">
            <button class="secondaryButton"
                    id="clearButton"
                    onclick="clearDrawing()">
                Clear
            </button>

            <button class="primary"
                    id="checkButton"
                    onclick="checkWriting()">
                Check
            </button>
        </div>

        <div class="writeResult" id="writeResult"></div>

        <p class="muted" id="writeProgress"></p>

    </div>

</section>


<!-- WORD -->

<section id="word">

    <div class="card hero">

        <div class="stageBadge" id="wordBadge">
            Word of the Day
        </div>

        <div class="wordBig" id="wordBig"></div>

        <div class="wordMeaning" id="wordMeaning"></div>

        <div class="wordAttempts" id="wordAttempts"></div>

        <div id="wordQuestion"></div>

    </div>

    <div class="card">
        <h3 id="calendarTitle">Calendar</h3>
        <div class="calendar" id="calendar"></div>
    </div>

</section>


<!-- REVIEW -->

<section id="review">

    <div class="card">

        <h2 id="reviewTitle">Review</h2>

        <p class="muted" id="reviewSubtitle">
            Characters that still need practice.
        </p>

        <div id="reviewList"></div>

    </div>

</section>

</div>

/* =========================================================
   STATE
========================================================= */

let saved = localStorage.getItem("hangulQuestState");

let s = saved
    ? JSON.parse(saved)
    : {
        language:"en",
        unlocked:1,
        mastery:{},
        lessonProgress:{},
        wordAttempts:{}
    };


if(!s.language) s.language="en";
if(!s.unlocked) s.unlocked=1;
if(!s.mastery) s.mastery={};
if(!s.lessonProgress) s.lessonProgress={};
if(!s.wordAttempts) s.wordAttempts={};


/* Initialize every lesson */

units.forEach((unit,index)=>{

    if(!s.lessonProgress[index]){
        s.lessonProgress[index] = {
            practice:{},
            build:{},
            writing:{},
            test:{
                passed:false,
                lastScore:null,
                attempts:0
            }
        };
    }

    const p = s.lessonProgress[index];

    if(!p.practice) p.practice={};
    if(!p.build) p.build={};
    if(!p.writing) p.writing={};
    if(!p.test){
        p.test={
            passed:false,
            lastScore:null,
            attempts:0
        };
    }

    unit.items.forEach(item=>{

        const key=item[0];

        if(typeof p.practice[key] !== "number"){
            p.practice[key]=0;
        }

        if(typeof p.build[key] !== "number"){
            p.build[key]=0;
        }

        if(typeof p.writing[key] !== "number"){
            p.writing[key]=0;
        }

        if(!s.mastery[key]){
            s.mastery[key]={
                correct:0,
                wrong:0
            };
        }

    });

    /*
      Preserve older unlocked progress.
      Lessons before the currently unlocked lesson are considered passed.
    */

    if(index < s.unlocked-1){
        p.test.passed=true;
    }

});


function save(){
    localStorage.setItem("hangulQuestState",JSON.stringify(s));
}

let currentView="home";
let activeUnit=0;

function setView(view){

    document.querySelectorAll("section").forEach(section=>{

    });

/* =========================================================
   LESSON PROGRESSION
========================================================= */

function lessonProgress(index){

    return s.lessonProgress[index];
}


function practiceComplete(index){

    const p=lessonProgress(index);

    return units[index].items.every(item=>{
        return p.practice[item[0]]>=3;
    });
}


function buildComplete(index){

    const p=lessonProgress(index);

    return units[index].items.every(item=>{
        return p.build[item[0]]>=2;
    });
}


function writingComplete(index){

    const p=lessonProgress(index);

    return units[index].items.every(item=>{
        return p.writing[item[0]]>=3;
    });
}


function lessonPassed(index){

    return !!lessonProgress(index).test.passed;
}


function getStage(index){

    if(lessonPassed(index)){
        return "passed";
    }

    if(!practiceComplete(index)){
        return "practice";
    }

    if(!buildComplete(index)){
        return "build";
    }

    if(!writingComplete(index)){
        return "write";
    }

    return "test";
}


function stageNumber(index){

    const stage=getStage(index);

    if(stage==="practice") return 1;
    if(stage==="build") return 2;
    if(stage==="write") return 3;
    if(stage==="test") return 4;

    return 4;
}


/* =========================================================
   HOME
========================================================= */

function renderHomeProgress(){

    const passed=units.filter((_,i)=>lessonPassed(i)).length;

    const percent=Math.round(
        (passed/units.length)*100
    );

    document.getElementById("courseProgress").style.width =
        percent+"%";

    document.getElementById("courseProgressText").textContent =
        `${percent}% — ${passed}/${units.length} ${T("completed")}`;
}


function renderLessons(){

    renderHomeProgress();

    const container=document.getElementById("lessonList");

    container.innerHTML="";

    units.forEach((unit,index)=>{

        const unlocked=index < s.unlocked;
        const stage=getStage(index);

        let statusText="";

        if(lessonPassed(index)){
            statusText=T("passed");
        }
        else if(!unlocked){
            statusText=T("locked");
        }
        else if(stage==="practice"){
            const p=lessonProgress(index);

            const done=unit.items.filter(
                item=>p.practice[item[0]]>=3
            ).length;

            statusText=`${T("practiceShort")} ${done}/${unit.items.length}`;
        }
        else if(stage==="build"){
            const p=lessonProgress(index);

            const done=unit.items.filter(
                item=>p.build[item[0]]>=2
            ).length;

            statusText=`${T("buildShort")} ${done}/${unit.items.length}`;
        }
        else if(stage==="write"){
            const p=lessonProgress(index);

            const done=unit.items.filter(
                item=>p.writing[item[0]]>=3
            ).length;

            statusText=`${T("writeShort")} ${done}/${unit.items.length}`;
        }
        else{
            statusText=T("testShort");
        }

        const card=document.createElement("div");
        card.className="card lesson";

        const number=document.createElement("div");
        number.className="lessonNumber";
        number.textContent=index+1;

        const info=document.createElement("div");
        info.className="lessonInfo";

        const strong=document.createElement("strong");
        strong.textContent=
            s.language==="en"
                ? unit.name
                : unit.ko;

        const small=document.createElement("small");
        small.textContent=statusText;

        info.appendChild(strong);
        info.appendChild(small);

        const button=document.createElement("button");

        if(!unlocked){

            button.className="locked";
            button.textContent="🔒";
            button.disabled=true;

        }
        else if(lessonPassed(index)){

            button.textContent="✓";

            button.onclick=()=>{
                startLesson(index);
            };

        }
        else{

            button.textContent=T("start");

            button.onclick=()=>{
                startLesson(index);
            };

        }

        card.appendChild(number);
        card.appendChild(info);
        card.appendChild(button);

        container.appendChild(card);

    });

}


/* =========================================================
   START LESSON
========================================================= */

function startLesson(index){

    if(index>=s.unlocked) return;

    activeUnit=index;

    setView("practice");

    renderLessonStage();
}


/* =========================================================
   PRACTICE STAGE
========================================================= */

let currentQuestion=null;
let questionLocked=false;


/*
  IMPORTANT:
  Only unfinished letters are selected.
*/

function getIncompletePracticeItems(){

    const p=lessonProgress(activeUnit);

    return units[activeUnit].items.filter(item=>{
        return p.practice[item[0]]<3;
    });
}


function chooseRandom(arr){

    return arr[
        Math.floor(Math.random()*arr.length)
    ];
}


function makeLetterChoices(correct){

    const items=units[activeUnit].items
        .map(item=>item[0]);

    const others=items.filter(x=>x!==correct);

    const choices=[correct];

    while(
        choices.length<Math.min(4,items.length)
    ){

        const option=chooseRandom(others);

        if(!choices.includes(option)){
            choices.push(option);
        }

    }

    return choices.sort(()=>Math.random()-.5);
}


function startPracticeQuestion(){

    const incomplete=getIncompletePracticeItems();

    if(incomplete.length===0){

        startBuildStage();
        return;
    }

    /*
      Only select something the user still needs.
    */

    const item=chooseRandom(incomplete);

    const mode=Math.random()<0.5
        ? "soundToLetter"
        : "letterToSound";

    currentQuestion={
        type:"practice",
        item:item,
        mode:mode
    };

    questionLocked=false;

    renderPracticeQuestion();
}


function renderPracticeQuestion(){

    document.getElementById("questionCard").style.display="block";
    document.getElementById("builderCard").style.display="none";
    document.getElementById("testResult").style.display="none";

    const item=currentQuestion.item;
    const letter=item[0];
    const sound=item[1];

    const mode=currentQuestion.mode;

    document.getElementById("questionMode").textContent =
        mode==="soundToLetter"
            ? T("guess")+" — "+sound
            : letter;

    document.getElementById("bigLetter").textContent =
        mode==="soundToLetter"
            ? "?"
            : letter;

    const answers=document.getElementById("answers");

    answers.innerHTML="";

    const correctAnswer =
        mode==="soundToLetter"
            ? letter
            : sound;

    makeLetterChoices(
        mode==="soundToLetter"
            ? letter
            : letter
    ).forEach(choice=>{

        const button=document.createElement("button");

        button.className="answer";

        button.textContent =
            mode==="soundToLetter"
                ? choice
                : units[activeUnit]
                    .find(x=>x[0]===choice)?.[1] || choice;

        button.onclick=()=>{
            answerPractice(button,correctAnswer);
        };

        answers.appendChild(button);

    });

    const p=lessonProgress(activeUnit);

    const completed=units[activeUnit].items.filter(
        x=>p.practice[x[0]]>=3
    ).length;

    document.getElementById("practiceProgress").textContent =
        `${completed}/${units[activeUnit].items.length}`;

    document.getElementById("feedback").textContent="";
    document.getElementById("feedback").className="feedback";

}


function answerPractice(button,correctAnswer){

    if(questionLocked) return;

    questionLocked=true;

    const selected=button.textContent;

    const isCorrect=selected===correctAnswer;

    const letter=currentQuestion.item[0];

    const mastery=s.mastery[letter];

    if(isCorrect){

        mastery.correct++;

        const p=lessonProgress(activeUnit);

        p.practice[letter]=Math.min(
            3,
            p.practice[letter]+1
        );

        button.classList.add("correct");

        document.getElementById("feedback").textContent =
            T("correct");

        document.getElementById("feedback").className =
            "feedback good";

    }
    else{

        mastery.wrong++;

        button.classList.add("wrong");

        document.getElementById("feedback").textContent =
            T("wrong");

        document.getElementById("feedback").className =
            "feedback bad";

        document.querySelectorAll(".answer").forEach(b=>{
            if(b.textContent===correctAnswer){
                b.classList.add("correct");
            }
        });

    }

    save();
    updateStats();
    renderHomeProgress();

    setTimeout(()=>{

        questionLocked=false;

        if(practiceComplete(activeUnit)){
            startBuildStage();
        }
        else{
            startPracticeQuestion();
        }

    },1250);

}


/* =========================================================
   BUILD STAGE
========================================================= */

let builderState=null;


/*
  Every lesson item gets its own build target.
  We never randomly choose a completed item.
*/

function getBuildData(letter){

    if(syllables[letter]){

        return {
            target:letter,
            parts:syllables[letter]
        };

    }

    if(consonantSyllables[letter]){

        return {
            target:consonantSyllables[letter],
            parts:[letter,"ㅏ"]
        };

    }

    if(vowelSyllables[letter]){

        return {
            target:vowelSyllables[letter],
            parts:["ㅇ",letter]
        };

    }

    return {
        target:letter,
        parts:[letter]
    };
}


function getIncompleteBuildItems(){

    const p=lessonProgress(activeUnit);

    return units[activeUnit].items.filter(item=>{
        return p.build[item[0]]<2;
    });
}


function startBuildStage(){

    if(!practiceComplete(activeUnit)){
        startPracticeQuestion();
        return;
    }

    const incomplete=getIncompleteBuildItems();

    if(incomplete.length===0){

        startWritingStage();
        return;
    }

    const item=chooseRandom(incomplete);

    const data=getBuildData(item[0]);

    builderState={
        mode:"build",
        item:item,
        data:data,
        partIndex:0,
        failed:false
    };

    renderBuilder();
}


function makeBuildChoices(correct,partIndex){

    let pool=[];

    if(partIndex===0){

        pool=units[activeUnit].items.map(x=>x[0]);

        /*
          Make sure there are useful distractors.
        */

        const common=[
            "ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ",
            "ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"
        ];

        pool=[...new Set([...pool,...common])];

    }
    else{

        pool=[
            "ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ",
            "ㅜ","ㅠ","ㅡ","ㅣ","ㅐ","ㅔ"
        ];

    }

    pool=pool.filter(x=>x!==correct);

    const choices=[correct];

    while(choices.length<4 && pool.length){

        const choice=chooseRandom(pool);

        if(!choices.includes(choice)){
            choices.push(choice);
        }

    }

    return choices.sort(()=>Math.random()-.5);
}


function renderBuilder(){

    document.getElementById("questionCard").style.display="none";
    document.getElementById("builderCard").style.display="block";
    document.getElementById("testResult").style.display="none";

    const target=builderState.data.target;
    const parts=builderState.data.parts;

    /*
      DO NOT show the answer at the beginning.

      The target is hidden until the user builds it.
      Each slot starts as ? and is revealed only
      after the user chooses that component.
    */

    document.getElementById("builderTarget").textContent="?";

    document.getElementById("builderSlot1").textContent =
        builderState.partIndex>0
            ? parts[0]
            : "?";

    document.getElementById("builderSlot2").textContent =
        builderState.partIndex>1
            ? parts[1]
            : "?";


    /*
      Tell the user what to do.
    */

    if(builderState.mode==="test"){

        document.getElementById("buildInstruction").textContent =
            builderState.partIndex===0
                ? T("chooseFirst")
                : T("chooseSecond");

    }
    else{

        document.getElementById("buildInstruction").textContent =
            builderState.partIndex===0
                ? T("chooseFirst")
                : T("chooseSecond");

    }


    /*
      Create the answer choices.
    */

    const choices=document.getElementById("builderChoices");

    choices.innerHTML="";

    const correct=parts[builderState.partIndex];

    makeBuildChoices(
        correct,
        builderState.partIndex
    ).forEach(choice=>{

        const button=document.createElement("button");

        button.className="buildChoice";
        button.textContent=choice;

        button.onclick=()=>{
            answerBuild(button,choice);
        };

        choices.appendChild(button);

    });


    document.getElementById("buildFeedback").textContent="";
    document.getElementById("buildFeedback").className="feedback";


    if(builderState.mode==="build"){

        const p=lessonProgress(activeUnit);

        const done=units[activeUnit].items.filter(
            x=>p.build[x[0]]>=2
        ).length;

        document.getElementById("buildProgress").textContent =
            `${done}/${units[activeUnit].items.length}`;

    }
    else{

        document.getElementById("buildProgress").textContent =
            `${testState.index+1}/${testState.tasks.length}`;

    }

}


function answerBuild(button,choice){

    if(builderState.locked) return;

    const correct=
        builderState.data.parts[
            builderState.partIndex
        ];

    /*
      Wrong answer:
      the attempt fails and we move to the next challenge.
    */

    if(choice!==correct){

        builderState.locked=true;

        button.classList.add("wrong");

        document.getElementById("buildFeedback").textContent =
            T("wrong");

        document.getElementById("buildFeedback").className =
            "feedback bad";


        setTimeout(()=>{

            builderState.locked=false;

            if(builderState.mode==="test"){

                finishTestTask(false);

            }
            else{

                startBuildStage();

            }

        },1250);

        return;
    }


    /*
      Correct answer.
    */

    button.classList.add("correct");

    /*
      Reveal the component that was just selected.
    */

    if(builderState.partIndex===0){

        document.getElementById("builderSlot1").textContent =
            correct;

    }
    else{

        document.getElementById("builderSlot2").textContent =
            correct;

    }


    builderState.partIndex++;


    /*
      First component is correct.
      Now ask for the second component.
    */

    if(builderState.partIndex<
       builderState.data.parts.length){

        document.getElementById("buildFeedback").textContent =
            T("correct");

        document.getElementById("buildFeedback").className =
            "feedback good";

        setTimeout(()=>{

            builderState.locked=false;

            renderBuilder();

        },350);

        return;
    }


    /*
      BOTH components are correct.
      Now reveal the completed syllable.
    */

    builderState.locked=true;

    document.getElementById("builderTarget").textContent =
        builderState.data.target;

    document.getElementById("buildFeedback").textContent =
        T("correct");

    document.getElementById("buildFeedback").className =
        "feedback good";


    if(builderState.mode==="build"){

        const letter=builderState.item[0];

        const p=lessonProgress(activeUnit);

        p.build[letter]=Math.min(
            2,
            p.build[letter]+1
        );

        save();

    }


    setTimeout(()=>{

        builderState.locked=false;

        if(builderState.mode==="test"){

            finishTestTask(true);

        }
        else if(buildComplete(activeUnit)){

            startWritingStage();

        }
        else{

            startBuildStage();

        }

    },1250);

}


/* =========================================================
   WRITING STAGE
========================================================= */

let writingState={
    item:null,
    streak:0
};


/*
  Writing is NOT random after it starts.

  The same item remains until it has been
  successfully drawn 3 times in a row.
*/

function getIncompleteWritingItems(){

    const p=lessonProgress(activeUnit);

    return units[activeUnit].items.filter(item=>{
        return p.writing[item[0]]<3;
    });
}


function startWritingStage(){

    if(!buildComplete(activeUnit)){
        startBuildStage();
        return;
    }

    const incomplete=getIncompleteWritingItems();

    if(incomplete.length===0){

        startTestStage();
        return;
    }

    /*
      Pick the next thing that needs writing.
      Once selected, it remains the same word
      for all 3 consecutive attempts.
    */

    const item=chooseRandom(incomplete);

    writingState={
        item:item,
        streak:0
    };

    setView("write");
    renderWriting();
}


function renderWriting(){

    if(!writingState.item){

        const incomplete=getIncompleteWritingItems();

        if(incomplete.length){

            writingState={
                item:incomplete[0],
                streak:0
            };

        }
        else{

            writingState={
                item:units[activeUnit].items[0],
                streak:0
            };

        }

    }

    const item=writingState.item;

    document.getElementById("writeWord").textContent=item[0];

    document.getElementById("writeBadge").textContent =
        `${T("writeStage")} — ${writingState.streak}/3`;

    document.getElementById("writeProgress").textContent =
        `${T("writingProgress")} ${writingState.streak}/3`;

    setupGuide(item[0]);

    clearDrawing();

    document.getElementById("writeResult").textContent="";
}


function setupGuide(letter){

    const drawCanvas=document.getElementById("drawCanvas");
    const guideCanvas=document.getElementById("guideCanvas");

    const size=600;

    drawCanvas.width=size;
    drawCanvas.height=size;

    guideCanvas.width=size;
    guideCanvas.height=size;

    const gctx=guideCanvas.getContext("2d");

    gctx.clearRect(0,0,size,size);

    gctx.fillStyle="black";

    gctx.textAlign="center";
    gctx.textBaseline="middle";

    /*
      Large guide character.
    */

    gctx.font='500 430px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';

    gctx.fillText(
        letter,
        size/2,
        size/2+15
    );

}


/* =========================================================
   DRAWING
========================================================= */

const drawCanvas=document.getElementById("drawCanvas");

let drawing=false;
let lastX=0;
let lastY=0;


function canvasPoint(event){

    const rect=drawCanvas.getBoundingClientRect();

    const source=
        event.touches
            ? event.touches[0]
            : event;

    return {
        x:(source.clientX-rect.left) *
            (drawCanvas.width/rect.width),

        y:(source.clientY-rect.top) *
            (drawCanvas.height/rect.height)
    };

}


function startDrawing(event){

    event.preventDefault();

    drawing=true;

    const p=canvasPoint(event);

    lastX=p.x;
    lastY=p.y;

}


function draw(event){

    if(!drawing) return;

    event.preventDefault();

    const p=canvasPoint(event);

    const ctx=drawCanvas.getContext("2d");

    ctx.strokeStyle="black";
    ctx.lineWidth=17;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();

    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);

    ctx.stroke();

    lastX=p.x;
    lastY=p.y;

}


function stopDrawing(){

    drawing=false;

}


drawCanvas.addEventListener("pointerdown",startDrawing);
drawCanvas.addEventListener("pointermove",draw);
drawCanvas.addEventListener("pointerup",stopDrawing);
drawCanvas.addEventListener("pointercancel",stopDrawing);
drawCanvas.addEventListener("pointerleave",stopDrawing);


function clearDrawing(){

    const ctx=drawCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

}


/*
  Slightly forgiving tracing recognition.

  The canvas is reduced to a small grid and each
  drawn cell is allowed to be close to the guide.

  This gives a small tolerance without making
  completely incorrect writing pass.
*/

function calculateWritingScore(){

    const size=80;

    const userCanvas=document.createElement("canvas");
    const guideCanvas=document.createElement("canvas");

    userCanvas.width=size;
    userCanvas.height=size;

    guideCanvas.width=size;
    guideCanvas.height=size;

    const uctx=userCanvas.getContext("2d");
    const gctx=guideCanvas.getContext("2d");

    uctx.drawImage(
        drawCanvas,
        0,0,size,size
    );

    gctx.drawImage(
        document.getElementById("guideCanvas"),
        0,0,size,size
    );

    const userData=uctx.getImageData(
        0,0,size,size
    ).data;

    const guideData=gctx.getImageData(
        0,0,size,size
    ).data;

    const userMask=new Uint8Array(size*size);
    const guideMask=new Uint8Array(size*size);

    let userCount=0;
    let guideCount=0;

    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const i=(y*size+x)*4;

            if(userData[i+3]>25){

                userMask[y*size+x]=1;
                userCount++;

            }

            if(guideData[i+3]>25){

                guideMask[y*size+x]=1;
                guideCount++;

            }

        }

    }

    if(userCount===0 || guideCount===0){
        return 0;
    }


    /*
      Small tolerance:
      one nearby grid cell counts as a match.
    */

    const radius=1;

    let userMatched=0;
    let guideMatched=0;

    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const index=y*size+x;

            if(userMask[index]){

                let found=false;

                for(let dy=-radius;dy<=radius;dy++){

                    for(let dx=-radius;dx<=radius;dx++){

                        const nx=x+dx;
                        const ny=y+dy;

                        if(
                            nx>=0 &&
                            nx<size &&
                            ny>=0 &&
                            ny<size &&
                            guideMask[ny*size+nx]
                        ){

                            found=true;
                            break;

                        }

                    }

                    if(found) break;

                }

                if(found) userMatched++;

            }

            if(guideMask[index]){

                let found=false;

                for(let dy=-radius;dy<=radius;dy++){

                    for(let dx=-radius;dx<=radius;dx++){

                        const nx=x+dx;
                        const ny=y+dy;

                        if(
                            nx>=0 &&
                            nx<size &&
                            ny>=0 &&
                            ny<size &&
                            userMask[ny*size+nx]
                        ){

                            found=true;
                            break;

                        }

                    }

                    if(found) break;

                }

                if(found) guideMatched++;

            }

        }

    }


    const precision=
        userMatched/userCount;

    const coverage=
        guideMatched/guideCount;

    /*
      Coverage matters slightly more because
      the user needs to actually trace the character.
    */

    const score=
        (precision*0.45)+(coverage*0.55);

    return Math.max(
        0,
        Math.min(
            100,
            Math.round(score*100)
        )
    );

}


function checkWriting(){

    const score=calculateWritingScore();

    const result=document.getElementById("writeResult");

    if(score>=70){

        result.textContent=
            `${score}% — ${T("readable")}`;

        result.style.color="var(--green)";

        writingState.streak++;

        const p=lessonProgress(activeUnit);

        const letter=writingState.item[0];

        p.writing[letter]=Math.min(
            3,
            writingState.streak
        );

        save();

        /*
          Same word stays on screen until
          all 3 consecutive attempts succeed.
        */

        if(writingState.streak>=3){

            result.textContent=
                `${score}% — ${T("readable")} 🎉`;

            setTimeout(()=>{

                if(writingComplete(activeUnit)){

                    startTestStage();

                }
                else{

                    startWritingStage();

                }

            },1250);

        }
        else{

            /*
              Clear canvas but KEEP SAME WORD.
            */

            setTimeout(()=>{

                clearDrawing();

                document.getElementById("writeResult").textContent="";

                document.getElementById("writeBadge").textContent =
                    `${T("writeStage")} — ${writingState.streak}/3`;

                document.getElementById("writeProgress").textContent =
                    `${T("writingProgress")} ${writingState.streak}/3`;

            },1250);

        }

    }
    else{

        result.textContent=
            `${score}% — ${T("practiceMore")}`;

        result.style.color="var(--red)";

        /*
          A failed drawing resets the consecutive streak.
          The same word remains selected.
        */

        writingState.streak=0;

        const p=lessonProgress(activeUnit);

        p.writing[writingState.item[0]]=0;

        save();

        setTimeout(()=>{

            clearDrawing();

            document.getElementById("writeResult").textContent="";

            document.getElementById("writeBadge").textContent =
                `${T("writeStage")} — 0/3`;

            document.getElementById("writeProgress").textContent =
                `${T("writingProgress")} 0/3`;

        },1250);

    }

}


/* =========================================================
   FINAL TEST
========================================================= */

let testState={
    tasks:[],
    index:0,
    correct:0,
    locked:false
};


function startTestStage(){

    if(!practiceComplete(activeUnit)){
        setView("practice");
        startPracticeQuestion();
        return;
    }

    if(!buildComplete(activeUnit)){
        setView("practice");
        startBuildStage();
        return;
    }

    if(!writingComplete(activeUnit)){
        startWritingStage();
        return;
    }

    /*
      Each letter gets:
      1 guess task
      1 build task

      Exactly once each.
    */

    const tasks=[];

    units[activeUnit].items.forEach(item=>{

        tasks.push({
            type:"guess",
            item:item
        });

    });

    units[activeUnit].items.forEach(item=>{

        tasks.push({
            type:"build",
            item:item
        });

    });

    testState={
        tasks:tasks,
        index:0,
        correct:0,
        locked:false
    };

    setView("practice");

    renderTestTask();

}


function renderTestTask(){

    document.getElementById("testResult").style.display="none";

    const task=testState.tasks[testState.index];

    if(!task){

        finishTest();

        return;
    }

    if(task.type==="guess"){

        renderTestGuess(task);

    }
    else{

        renderTestBuild(task);

    }

}


function renderTestGuess(task){

    document.getElementById("questionCard").style.display="block";
    document.getElementById("builderCard").style.display="none";

    const letter=task.item[0];
    const sound=task.item[1];

    document.getElementById("questionMode").textContent =
        `${T("guess")} — ${sound}`;

    document.getElementById("bigLetter").textContent="?";

    const answers=document.getElementById("answers");

    answers.innerHTML="";

    makeLetterChoices(letter).forEach(choice=>{

        const button=document.createElement("button");

        button.className="answer";
        button.textContent=choice;

        button.onclick=()=>{
            answerTestGuess(button,choice,letter);
        };

        answers.appendChild(button);

    });

    document.getElementById("feedback").textContent="";

    document.getElementById("practiceProgress").textContent =
        `${testState.index+1}/${testState.tasks.length}`;

    updateStageHeader();

}


function answerTestGuess(button,choice,correct){

    if(testState.locked) return;

    testState.locked=true;

    const isCorrect=choice===correct;

    if(isCorrect){

        testState.correct++;

        button.classList.add("correct");

        document.getElementById("feedback").textContent =
            T("correct");

        document.getElementById("feedback").className =
            "feedback good";

    }
    else{

        button.classList.add("wrong");

        document.getElementById("feedback").textContent =
            T("wrong");

        document.getElementById("feedback").className =
            "feedback bad";

        document.querySelectorAll(".answer").forEach(b=>{

            if(b.textContent===correct){
                b.classList.add("correct");
            }

        });

    }

    setTimeout(()=>{

        testState.index++;
        testState.locked=false;

        renderTestTask();

    },1250);

}


function renderTestBuild(task){

    document.getElementById("questionCard").style.display="none";
    document.getElementById("builderCard").style.display="block";

    const data=getBuildData(task.item[0]);

    builderState={
        mode:"test",
        item:task.item,
        data:data,
        partIndex:0,
        locked:false,
        failed:false
    };

    renderBuilder();

    updateStageHeader();

}


function finishTestTask(success){

    if(success){
        testState.correct++;
    }

    setTimeout(()=>{

        testState.index++;

        if(testState.index>=testState.tasks.length){

            finishTest();

        }
        else{

            renderTestTask();

        }

    },0);

}


function finishTest(){

    const total=testState.tasks.length;

    const score=Math.round(
        (testState.correct/total)*100
    );

    const p=lessonProgress(activeUnit);

    p.test.lastScore=score;
    p.test.attempts++;

    const result=document.getElementById("testResult");

    document.getElementById("questionCard").style.display="none";
    document.getElementById("builderCard").style.display="none";

    result.style.display="block";

    document.getElementById("testScore").textContent =
        `${score}%`;

    if(score>=70){

        p.test.passed=true;

        /*
          Unlock ONLY the next lesson.
        */

        if(
            activeUnit===s.unlocked-1 &&
            s.unlocked<units.length
        ){

            s.unlocked++;

        }

        document.getElementById("testResultBadge").textContent =
            T("passedTest")+" 🎉";

        document.getElementById("testResultText").textContent =
            s.language==="en"
                ? "Lesson complete! The next lesson is unlocked."
                : "수업 완료! 다음 수업이 열렸어요.";

        save();

        renderLessons();

        setTimeout(()=>{

            setView("home");

        },1800);

    }
    else{

        document.getElementById("testResultBadge").textContent =
            T("retest");

        document.getElementById("testResultText").textContent =
            s.language==="en"
                ? "You need 70% to pass. Retaking the same lesson..."
                : "통과하려면 70%가 필요해요. 같은 수업을 다시 시험해요.";

        save();

        /*
          Retest the same lesson.
          Practice/build/writing progress is NOT erased.
        */

        setTimeout(()=>{

            startTestStage();

        },1800);

    }

}


/* =========================================================
   STAGE HEADER
========================================================= */

function updateStageHeader(){

    const stage=getStage(activeUnit);

    let title="";
    let description="";
    let badge="";

    if(stage==="practice"){

        title=T("practiceTitle");
        description=T("practiceDescription");
        badge=`${T("stage")} 1/4 — ${T("practiceStage")}`;

    }
    else if(stage==="build"){

        title=T("buildTitle");
        description=T("buildDescription");
        badge=`${T("stage")} 2/4 — ${T("buildStage")}`;

    }
    else if(stage==="write"){

        title=T("writeTitle");
        description=T("writeDescription");
        badge=`${T("stage")} 3/4 — ${T("writeStage")}`;

    }
    else{

        title=T("testTitle");
        description=T("testDescription");
        badge=`${T("stage")} 4/4 — ${T("testStage")}`;

    }

    document.getElementById("stageBadge").textContent=badge;
    document.getElementById("stageTitle").textContent=title;
    document.getElementById("stageDescription").textContent=description;

}


/* =========================================================
   RENDER CURRENT LESSON STAGE
========================================================= */

function renderLessonStage(){

    updateStats();

    const stage=getStage(activeUnit);

    if(stage==="passed"){

        document.getElementById("questionCard").style.display="none";
        document.getElementById("builderCard").style.display="none";

        document.getElementById("stageBadge").textContent =
            T("passed")+" ✓";

        document.getElementById("stageTitle").textContent =
            T("passedTest");

        document.getElementById("stageDescription").textContent =
            s.language==="en"
                ? "You completed this lesson."
                : "이 수업을 완료했어요.";

        return;
    }

    updateStageHeader();

    if(stage==="practice"){

        startPracticeQuestion();

    }
    else if(stage==="build"){

        startBuildStage();

    }
    else if(stage==="write"){

        startWritingStage();

    }
    else if(stage==="test"){

        startTestStage();

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    let correct=0;
    let wrong=0;

    Object.values(s.mastery).forEach(m=>{

        correct+=m.correct||0;
        wrong+=m.wrong||0;

    });

    const total=correct+wrong;

    const accuracy=total
        ? Math.round((correct/total)*100)
        : 0;

    document.getElementById("statCorrect").textContent=correct;
    document.getElementById("statWrong").textContent=wrong;
    document.getElementById("statAccuracy").textContent=
        accuracy+"%";

}


/* =========================================================
   WRITING STANDALONE TAB
========================================================= */

function beginStandaloneWriting(){

    const item=units[activeUnit].items[0];

    writingState={
        item:item,
        streak:0
    };

    renderWriting();

}


/* =========================================================
   WORD OF THE DAY
========================================================= */

function dateKey(date=new Date()){

    return date.toISOString().slice(0,10);

}


function getWordIndex(){

    const start=new Date("2026-01-01T00:00:00");

    const now=new Date();

    const days=Math.floor(
        (now-start)/(1000*60*60*24)
    );

    return (
        ((days % wordData.length)+wordData.length)
        %wordData.length
    );

}


function renderWord(){

    const index=getWordIndex();

    const data=wordData[index];

    document.getElementById("wordBig").textContent=
        data.word;

    document.getElementById("wordMeaning").textContent=
        s.language==="en"
            ? data.en
            : data.ko;

    const key=dateKey();

    if(!s.wordAttempts[key]){
        s.wordAttempts[key]={
            attempts:0,
            correct:false
        };
    }

    const attempts=s.wordAttempts[key];

    document.getElementById("wordAttempts").textContent =
        `${T("attempts")}: ${attempts.attempts}/3`;

    renderWordQuestion(data);

    renderCalendar();

    save();

}


function renderWordQuestion(data){

    const container=document.getElementById("wordQuestion");

    container.innerHTML="";

    const input=document.createElement("input");

    input.type="text";
    input.autocomplete="off";
    input.placeholder=
        s.language==="en"
            ? "Type the Korean word"
            : "한국어 단어를 입력하세요";

    input.style.width="100%";
    input.style.padding="15px";
    input.style.borderRadius="14px";
    input.style.border="1px solid var(--border)";
    input.style.fontSize="18px";
    input.style.marginTop="15px";

    const button=document.createElement("button");

    button.className="primary";
    button.style.marginTop="10px";
    button.style.width="100%";
    button.textContent=T("check");

    const feedback=document.createElement("div");

    feedback.className="feedback";

    button.onclick=()=>{

        checkWord(input,feedback,data);

    };

    container.appendChild(input);
    container.appendChild(button);
    container.appendChild(feedback);

}


function checkWord(input,feedback,data){

    const key=dateKey();

    const attempts=s.wordAttempts[key];

    if(attempts.attempts>=3) return;

    attempts.attempts++;

    const correct=
        input.value.trim()===data.word;

    if(correct){

        attempts.correct=true;

        feedback.textContent=T("correct");
        feedback.className="feedback good";

    }
    else{

        feedback.textContent=T("wrong");
        feedback.className="feedback bad";

    }

    save();

    document.getElementById("wordAttempts").textContent =
        `${T("attempts")}: ${attempts.attempts}/3`;

    renderCalendar();

    if(attempts.attempts>=3){

        setTimeout(()=>{

            document.getElementById("wordQuestion").innerHTML =
                attempts.correct
                    ? "✓"
                    : data.word;

        },700);

    }

}


/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar(){

    const calendar=document.getElementById("calendar");

    calendar.innerHTML="";

    const now=new Date();

    for(let i=0;i<30;i++){

        const d=new Date(now);

        d.setDate(now.getDate()-i);

        const key=dateKey(d);

        const cell=document.createElement("div");

        cell.className="day";

        const attempts=s.wordAttempts[key];

        if(attempts?.correct){

            cell.classList.add("done");

        }
        else if(attempts?.attempts){

            cell.classList.add("partial");

        }

        cell.textContent=d.getDate();

        calendar.appendChild(cell);

    }

}


/* =========================================================
   REVIEW
========================================================= */

function renderReview(){

    const container=document.getElementById("reviewList");

    container.innerHTML="";

    const items=[];

    Object.entries(s.mastery).forEach(([letter,m])=>{

        if(
            (m.correct||0)<3 ||
            (m.wrong||0)>0
        ){

            items.push({
                letter,
                correct:m.correct||0,
                wrong:m.wrong||0
            });

        }

    });

    if(items.length===0){

        const p=document.createElement("p");

        p.className="muted";
        p.textContent=T("noReview");

        container.appendChild(p);

        return;

    }

    items.sort((a,b)=>{

        const aScore=a.correct-a.wrong;
        const bScore=b.correct-b.wrong;

        return aScore-bScore;

    });

    items.forEach(item=>{

        const row=document.createElement("div");

        row.className="reviewItem";

        const letter=document.createElement("div");

        letter.className="reviewLetter";
        letter.textContent=item.letter;

        const bar=document.createElement("div");

        bar.className="reviewBar";

        const fill=document.createElement("div");

        fill.className="reviewFill";

        fill.style.width=
            Math.min(
                100,
                Math.round((item.correct/3)*100)
            )+"%";

        bar.appendChild(fill);

        const stats=document.createElement("small");

        stats.textContent=
            `${item.correct}/3`;

        row.appendChild(letter);
        row.appendChild(bar);
        row.appendChild(stats);

        container.appendChild(row);

    });

}


/* =========================================================
   INITIALIZE
========================================================= */

updateLanguageUI();
updateStats();
renderLessons();

setView("home");

</script>
