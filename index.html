<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Hangul Quest</title>

<style>

:root{

  --bg:#f5f5f7;

  --card:#ffffff;

  --text:#111111;

  --muted:#777;

  --line:#dedede;

  --accent:#007aff;

  --green:#34c759;

  --red:#ff3b30;

  --yellow:#ffcc00;

}

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}

body{

  margin:0;

  background:var(--bg);

  color:var(--text);

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",

               "SF Pro Text",Arial,sans-serif;

}

button{

  font:inherit;

  cursor:pointer;

  border:0;

}

.app{

  width:min(760px,100%);

  margin:auto;

  padding:16px;

  padding-bottom:40px;

}

header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:14px;

}

h1{

  margin:0;

  font-size:27px;

  letter-spacing:-.7px;

}

.subtitle{

  color:var(--muted);

  font-size:13px;

  margin-top:3px;

}

.sound{

  width:42px;

  height:42px;

  border-radius:50%;

  background:#fff;

  border:1px solid var(--line);

  font-size:19px;

}

.tabs{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:7px;

  margin-bottom:14px;

}

.tab{

  padding:10px 5px;

  border-radius:12px;

  background:#e9e9ed;

  color:#555;

  font-size:13px;

  font-weight:600;

}

.tab.active{

  background:#111;

  color:white;

}

.card{

  background:var(--card);

  border:1px solid var(--line);

  border-radius:20px;

  padding:18px;

  box-shadow:0 2px 10px rgba(0,0,0,.035);

  margin-bottom:14px;

}

.hidden{

  display:none!important;

}

.sectionTitle{

  font-size:21px;

  font-weight:750;

  letter-spacing:-.4px;

}

.small{

  color:var(--muted);

  font-size:13px;

}

.progressBar{

  height:8px;

  border-radius:20px;

  background:#e8e8eb;

  overflow:hidden;

  margin-top:12px;

}

.progressFill{

  height:100%;

  background:var(--accent);

  width:0%;

  transition:.25s;

}

.lesson{

  border:1px solid var(--line);

  border-radius:16px;

  margin-bottom:8px;

  overflow:hidden;

  background:#fff;

}

.lessonHead{

  display:flex;

  align-items:center;

  gap:12px;

  padding:14px;

}

.lessonNumber{

  width:34px;

  height:34px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:#eee;

  font-weight:700;

  flex:none;

}

.lessonInfo{

  flex:1;

  min-width:0;

}

.lessonName{

  font-weight:700;

}

.lessonDesc{

  color:var(--muted);

  font-size:12px;

  margin-top:2px;

}

.status{

  font-size:12px;

  font-weight:700;

}

.status.done{

  color:var(--green);

}

.status.locked{

  color:#999;

}

.lessonButton{

  width:100%;

  padding:11px;

  background:#f2f2f5;

  border-top:1px solid var(--line);

  font-weight:650;

}

.lessonButton:disabled{

  color:#aaa;

  background:#f7f7f8;

}

.testRow{

  padding:10px 14px 14px;

  background:#fafafa;

  border-top:1px solid var(--line);

}

.testLabel{

  font-size:12px;

  font-weight:700;

  color:#666;

  margin-bottom:8px;

}

.primary{

  width:100%;

  background:var(--accent);

  color:#fff;

  padding:13px;

  border-radius:13px;

  font-weight:700;

}

.secondary{

  background:#eeeef2;

  color:#111;

  padding:11px 15px;

  border-radius:12px;

  font-weight:650;

}

.row{

  display:flex;

  gap:8px;

}

.row>*{

  flex:1;

}

.center{

  text-align:center;

}

#prompt{

  font-size:15px;

  color:#666;

  text-align:center;

}

#big{

  text-align:center;

  font-size:100px;

  line-height:1.1;

  margin:10px 0 20px;

  min-height:110px;

}

.answers{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:9px;

}

.answer{

  min-height:56px;

  border:2px solid #e4e4e7;

  background:#fff;

  border-radius:14px;

  padding:10px;

  font-size:17px;

  font-weight:650;

}

.answer.selected{

  border-color:var(--accent);

  background:#eef5ff;

}

.answer.correct{

  border-color:var(--green);

  background:#effcf3;

}

.answer.wrong{

  border-color:var(--red);

  background:#fff0ef;

}

#feedback,

#buildFeedback,

#testFeedback,

#writeFeedback{

  min-height:24px;

  text-align:center;

  font-weight:700;

  margin-top:12px;

}

.good{

  color:var(--green);

}

.bad{

  color:var(--red);

}

.builder{

  margin-top:8px;

}

.buildSlots{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin:18px 0;

}

.buildSlot{

  width:90px;

  height:90px;

  border:2px dashed #bbb;

  border-radius:17px;

  display:grid;

  place-items:center;

  font-size:48px;

  background:#fafafa;

}

.plus{

  font-size:28px;

  color:#999;

}

.buildResult{

  text-align:center;

  font-size:75px;

  min-height:90px;

  margin-bottom:15px;

}

.buildChoices{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:8px;

}

.buildChoice{

  padding:14px 5px;

  border-radius:13px;

  background:#f0f0f3;

  font-size:27px;

  font-weight:650;

}

.buildChoice.selected{

  background:#dceaff;

  outline:2px solid var(--accent);

}

.testTask{

  text-align:center;

}

.testType{

  color:#777;

  font-size:13px;

  margin-bottom:5px;

}

.testBig{

  font-size:90px;

  margin:12px 0;

}

.testChoices{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:9px;

}

.testBuild{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:7px;

  min-height:80px;

  font-size:48px;

}

.testBuildBox{

  width:72px;

  height:72px;

  border:2px solid #ddd;

  border-radius:14px;

  display:grid;

  place-items:center;

}

.writeControls{

  display:flex;

  gap:8px;

  margin-bottom:12px;

}

.modeButton{

  flex:1;

  padding:11px;

  border-radius:12px;

  background:#eeeef2;

  font-weight:700;

}

.modeButton.active{

  background:#111;

  color:#fff;

}

.writeTarget{

  text-align:center;

  font-size:30px;

  font-weight:700;

  margin-bottom:8px;

}

.canvasWrap{

  position:relative;

  width:min(100%,520px);

  aspect-ratio:1;

  margin:auto;

  border:1px solid #d5d5d8;

  border-radius:20px;

  overflow:hidden;

  background:#fff;

}

#canvas{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  z-index:2;

  touch-action:none;

}

#guide{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  z-index:1;

  pointer-events:none;

}

#guideText{

  font-family:

    "Apple SD Gothic Neo",

    "Noto Sans KR",

    "Malgun Gothic",

    sans-serif;

  font-size:270px;

  font-weight:500;

  fill:#e1e1e5;

  text-anchor:middle;

  dominant-baseline:central;

}

.writeActions{

  margin-top:12px;

  display:flex;

  gap:8px;

}

.writeActions button{

  flex:1;

}

.attemptInfo{

  text-align:center;

  margin:10px 0;

  color:#666;

  font-size:13px;

}

.statsGrid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

}

.stat{

  background:#f4f4f6;

  border-radius:14px;

  padding:13px;

  text-align:center;

}

.statNum{

  font-size:22px;

  font-weight:750;

}

.statLabel{

  color:#777;

  font-size:11px;

  margin-top:2px;

}

.reviewItem{

  display:flex;

  justify-content:space-between;

  padding:12px 0;

  border-bottom:1px solid #eee;

}

.reviewItem:last-child{

  border-bottom:0;

}

.char{

  font-size:25px;

  font-weight:650;

}

@media(max-width:430px){

  .app{

    padding:11px;

  }

  #big{

    font-size:88px;

  }

  .buildChoices{

    grid-template-columns:repeat(3,1fr);

  }

  .buildSlot{

    width:78px;

    height:78px;

  }

}

</style>

</head>

<body>

<div class="app">

<header>

  <div>

    <h1>Hangul Quest 🇰🇷</h1>

    <div class="subtitle">Learn Korean one building block at a time</div>

  </div>

  <button class="sound" id="soundBtn">🔊</button>

</header>

<div class="tabs">

  <button class="tab active" data-tab="learn">Learn</button>

  <button class="tab" data-tab="practice">Practice</button>

  <button class="tab" data-tab="write">Write</button>

  <button class="tab" data-tab="review">Review</button>

</div>

<!-- ================= LEARN ================= -->

<section id="learn">

  <div class="card">

    <div class="sectionTitle">Your Progress</div>

    <div class="small" id="courseStatus">Lesson 1</div>

    <div class="progressBar">

      <div class="progressFill" id="courseProgress"></div>

    </div>

  </div>

  <div id="lessonList"></div>

</section>

<!-- ================= PRACTICE ================= -->

<section id="practice" class="hidden">

  <div class="card">

    <div class="sectionTitle" id="practiceTitle">

      Multiple Choice

    </div>

    <div class="small center" id="practiceStatus">

      Choose the correct answer.

    </div>

    <div id="prompt"></div>

    <div id="big"></div>

    <div class="answers" id="answers"></div>

    <button

      class="primary"

      id="checkPractice"

      style="margin-top:12px"

      disabled>

      Check ✓

    </button>

    <div id="feedback"></div>

  </div>

</section>

<!-- ================= BUILD ================= -->

<section id="build" class="hidden">

  <div class="card">

    <div class="sectionTitle center">Building Blocks 🧩</div>

    <div class="small center" id="buildStatus">

      Build the Korean syllable.

    </div>

    <div class="buildResult" id="buildResult"></div>

    <div class="buildSlots">

      <div class="buildSlot" id="bs1">?</div>

      <div class="plus">+</div>

      <div class="buildSlot" id="bs2">?</div>

    </div>

    <div class="buildChoices" id="buildChoices"></div>

    <div id="buildFeedback"></div>

  </div>

</section>

<!-- ================= TEST ================= -->

<section id="test" class="hidden">

  <div class="card">

    <div class="sectionTitle center" id="testTitle">

      Test

    </div>

    <div class="small center" id="testProgress"></div>

    <div id="testArea"></div>

    <div id="testFeedback"></div>

  </div>

</section>

<!-- ================= WRITE ================= -->

<section id="write" class="hidden">

  <div class="card">

    <div class="sectionTitle center">Writing ✏️</div>

    <div class="small center">

      Get 3 readable drawings of each character.

    </div>

    <div class="writeControls">

      <button class="modeButton active" id="traceMode">

        Trace

      </button>

      <button class="modeButton" id="writeMode">

        Write

      </button>

    </div>

    <div class="writeTarget" id="writeTarget"></div>

    <div class="attemptInfo" id="writeAttempt"></div>

    <div class="canvasWrap">

      <svg id="guide"

           viewBox="0 0 500 500"

           preserveAspectRatio="xMidYMid meet">

        <text

          id="guideText"

          x="250"

          y="250"></text>

      </svg>

      <canvas id="canvas"></canvas>

    </div>

    <div class="writeActions">

      <button class="secondary" id="clearCanvas">

        Clear

      </button>

      <button class="primary" id="checkWrite">

        Check ✓

      </button>

    </div>

    <div id="writeFeedback"></div>

  </div>

</section>

<!-- ================= REVIEW ================= -->

<section id="review" class="hidden">

  <div class="card">

    <div class="sectionTitle">Review</div>

    <div class="statsGrid">

      <div class="stat">

        <div class="statNum" id="statCorrect">0</div>

        <div class="statLabel">Correct</div>

      </div>

      <div class="stat">

        <div class="statNum" id="statTotal">0</div>

        <div class="statLabel">Attempts</div>

      </div>

      <div class="stat">

        <div class="statNum" id="statStreak">0</div>

        <div class="statLabel">Streak</div>

      </div>

    </div>

    <div id="reviewList" style="margin-top:12px"></div>

  </div>

</section>

</div>

<script>

/* =========================================================

   HANGUL DATA

========================================================= */

const units = [

  {

    type:"lesson",

    name:"Consonants 1",

    desc:"The first 7 consonants",

    items:[

      ["ㄱ","g / k"],

      ["ㄴ","n"],

      ["ㄷ","d / t"],

      ["ㄹ","r / l"],

      ["ㅁ","m"],

      ["ㅂ","b / p"],

      ["ㅅ","s"]

    ]

  },

  {

    type:"test",

    name:"Test 1",

    desc:"Test: Consonants 1",

    items:[

      ["ㄱ","g / k"],

      ["ㄴ","n"],

      ["ㄷ","d / t"],

      ["ㄹ","r / l"],

      ["ㅁ","m"],

      ["ㅂ","b / p"],

      ["ㅅ","s"]

    ],

    lesson:0

  },

  {

    type:"lesson",

    name:"Consonants 2",

    desc:"More consonants",

    items:[

      ["ㅇ","ng / silent"],

      ["ㅈ","j"],

      ["ㅊ","ch"],

      ["ㅋ","k"],

      ["ㅌ","t"],

      ["ㅍ","p"],

      ["ㅎ","h"]

    ]

  },

  {

    type:"test",

    name:"Test 2",

    desc:"Test: Consonants 2",

    items:[

      ["ㅇ","ng / silent"],

      ["ㅈ","j"],

      ["ㅊ","ch"],

      ["ㅋ","k"],

      ["ㅌ","t"],

      ["ㅍ","p"],

      ["ㅎ","h"]

    ],

    lesson:1

  },

  {

    type:"lesson",

    name:"Vowels 1",

    desc:"Basic vowels",

    items:[

      ["ㅏ","a"],

      ["ㅑ","ya"],

      ["ㅓ","eo"],

      ["ㅕ","yeo"],

      ["ㅗ","o"],

      ["ㅛ","yo"],

      ["ㅜ","u"]

    ]

  },

  {

    type:"test",

    name:"Test 3",

    desc:"Test: Vowels 1",

    items:[

      ["ㅏ","a"],

      ["ㅑ","ya"],

      ["ㅓ","eo"],

      ["ㅕ","yeo"],

      ["ㅗ","o"],

      ["ㅛ","yo"],

      ["ㅜ","u"]

    ],

    lesson:2

  },

  {

    type:"lesson",

    name:"Vowels 2",

    desc:"The remaining basic vowels",

    items:[

      ["ㅠ","yu"],

      ["ㅡ","eu"],

      ["ㅣ","i"],

      ["ㅐ","ae"],

      ["ㅔ","e"]

    ]

  },

  {

    type:"test",

    name:"Test 4",

    desc:"Test: Vowels 2",

    items:[

      ["ㅠ","yu"],

      ["ㅡ","eu"],

      ["ㅣ","i"],

      ["ㅐ","ae"],

      ["ㅔ","e"]

    ],

    lesson:3

  },

  {

    type:"lesson",

    name:"Syllable Blocks 1",

    desc:"Combine consonants and vowels",

    items:[

      ["가","ga"],

      ["나","na"],

      ["다","da"],

      ["마","ma"],

      ["바","ba"],

      ["사","sa"]

    ]

  },

  {

    type:"test",

    name:"Test 5",

    desc:"Test: Syllable Blocks 1",

    items:[

      ["가","ga"],

      ["나","na"],

      ["다","da"],

      ["마","ma"],

      ["바","ba"],

      ["사","sa"]

    ],

    lesson:4

  },

  {

    type:"lesson",

    name:"Reading 1",

    desc:"Read simple Korean syllables",

    items:[

      ["너","neo"],

      ["미","mi"],

      ["고","go"],

      ["아","a"],

      ["우","u"],

      ["하","ha"]

    ]

  },

  {

    type:"test",

    name:"Test 6",

    desc:"Test: Reading 1",

    items:[

      ["너","neo"],

      ["미","mi"],

      ["고","go"],

      ["아","a"],

      ["우","u"],

      ["하","ha"]

    ],

    lesson:5

  }

];

const jamoBuild = {

  "가":["ㄱ","ㅏ"],

  "나":["ㄴ","ㅏ"],

  "다":["ㄷ","ㅏ"],

  "라":["ㄹ","ㅏ"],

  "마":["ㅁ","ㅏ"],

  "바":["ㅂ","ㅏ"],

  "사":["ㅅ","ㅏ"],

  "아":["ㅇ","ㅏ"],

  "자":["ㅈ","ㅏ"],

  "차":["ㅊ","ㅏ"],

  "카":["ㅋ","ㅏ"],

  "타":["ㅌ","ㅏ"],

  "파":["ㅍ","ㅏ"],

  "하":["ㅎ","ㅏ"],

  "야":["ㅇ","ㅑ"],

  "어":["ㅇ","ㅓ"],

  "여":["ㅇ","ㅕ"],

  "오":["ㅇ","ㅗ"],

  "요":["ㅇ","ㅛ"],

  "우":["ㅇ","ㅜ"],

  "유":["ㅇ","ㅠ"],

  "으":["ㅇ","ㅡ"],

  "이":["ㅇ","ㅣ"],

  "애":["ㅇ","ㅐ"],

  "에":["ㅇ","ㅔ"],

  "너":["ㄴ","ㅓ"],

  "미":["ㅁ","ㅣ"],

  "고":["ㄱ","ㅗ"]

};

const consonantToSyllable = {

  "ㄱ":"가",

  "ㄴ":"나",

  "ㄷ":"다",

  "ㄹ":"라",

  "ㅁ":"마",

  "ㅂ":"바",

  "ㅅ":"사",

  "ㅇ":"아",

  "ㅈ":"자",

  "ㅊ":"차",

  "ㅋ":"카",

  "ㅌ":"타",

  "ㅍ":"파",

  "ㅎ":"하"

};

const vowelToSyllable = {

  "ㅏ":"아",

  "ㅑ":"야",

  "ㅓ":"어",

  "ㅕ":"여",

  "ㅗ":"오",

  "ㅛ":"요",

  "ㅜ":"우",

  "ㅠ":"유",

  "ㅡ":"으",

  "ㅣ":"이",

  "ㅐ":"애",

  "ㅔ":"에"

};

/* =========================================================

   STATE

========================================================= */

const STORAGE_KEY = "hangulQuest_v5";

let s = JSON.parse(

  localStorage.getItem(STORAGE_KEY) || "null"

) || {

  correct:0,

  total:0,

  streak:0,

  unlockedLesson:0,

  lessonProgress:{},

  /*

    practice:

    how many CORRECT answers each character has.

  */

  practiceProgress:{},

  /*

    build:

    how many successful builds each character has.

  */

  buildProgress:{},

  /*

    writing:

    how many >=70% drawings each character has.

  */

  writingProgress:{},

  /*

    tests passed

  */

  testsPassed:{}

};

let currentLesson = 0;

let practiceState = {

  item:null,

  right:null,

  selected:null,

  locked:false

};

let buildState = {

  item:null,

  target:null,

  needed:[],

  picked:[],

  count:0,

  locked:false

};

let testState = {

  lesson:0,

  tasks:[],

  index:0,

  correct:0,

  locked:false

};

let writeState = {

  target:null,

  mode:"trace",

  /*

    Number of successful drawings for current target.

    This is NOT consecutive.

  */

  success:0,

  /*

    Number of attempts is only informational.

  */

  attempts:0,

  drawing:false,

  lastX:0,

  lastY:0

};

/* =========================================================

   HELPERS

========================================================= */

const $ = id => document.getElementById(id);

function save(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(s)

  );

}

function shuffle(arr){

  const a = [...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function rand(arr){

  return arr[

    Math.floor(Math.random()*arr.length)

  ];

}

function lessonData(i){

  return units[i*2];

}

function testData(i){

  return units[i*2+1];

}

function ensureLesson(i){

  if(!s.lessonProgress[i]){

    s.lessonProgress[i]={

      practiceDone:false,

      buildDone:false

    };

  }

}

function keyFor(item){

  return item[0];

}

function practiceCount(item){

  return Number(

    s.practiceProgress[keyFor(item)] || 0

  );

}

function buildCount(item){

  return Number(

    s.buildProgress[keyFor(item)] || 0

  );

}

function writingCount(char){

  return Number(

    s.writingProgress[char] || 0

  );

}

function isTestPassed(i){

  return !!s.testsPassed[i];

}

function practiceComplete(i){

  ensureLesson(i);

  return lessonData(i).items.every(

    item => practiceCount(item)>=3

  );

}

function buildComplete(i){

  ensureLesson(i);

  return lessonData(i).items.every(

    item => buildCount(item)>=2

  );

}

function lessonUnlocked(i){

  return i<=s.unlockedLesson;

}

/* =========================================================

   TABS

========================================================= */

document.querySelectorAll(".tab").forEach(btn=>{

  btn.addEventListener("click",()=>{

    const tab=btn.dataset.tab;

    document.querySelectorAll(".tab")

      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    ["learn","practice","build","test","write","review"]

      .forEach(id=>{

        $(id).classList.toggle(

          "hidden",

          id!==tab

        );

      });

    if(tab==="learn") renderLessons();

    if(tab==="review") renderReview();

    if(tab==="write"){

      startWriting();

    }

  });

});

function openTab(name){

  document.querySelectorAll(".tab")

    .forEach(x=>{

      x.classList.toggle(

        "active",

        x.dataset.tab===name

      );

    });

  ["learn","practice","build","test","write","review"]

    .forEach(id=>{

      $(id).classList.toggle(

        "hidden",

        id!==name

      );

    });

}

/* =========================================================

   LEARN / LESSON LIST

========================================================= */

function renderLessons(){

  const list=$("lessonList");

  list.innerHTML="";

  for(let i=0;i<6;i++){

    ensureLesson(i);

    const lesson=lessonData(i);

    const unlocked=lessonUnlocked(i);

    const passed=isTestPassed(i);

    let status="Locked";

    if(passed) status="✓ Complete";

    else if(unlocked) status="Learning";

    const box=document.createElement("div");

    box.className="lesson";

    box.innerHTML=`

      <div class="lessonHead">

        <div class="lessonNumber">

          ${i+1}

        </div>

        <div class="lessonInfo">

          <div class="lessonName">

            ${lesson.name}

          </div>

          <div class="lessonDesc">

            ${lesson.desc}

          </div>

        </div>

        <div class="status ${passed?"done":!unlocked?"locked":""}">

          ${status}

        </div>

      </div>

      <button

        class="lessonButton"

        ${!unlocked?"disabled":""}

        id="learnBtn${i}">

        ${passed?"Review Lesson":"Start Lesson"}

      </button>

      <div class="testRow">

        <div class="testLabel">

          TEST ${i+1}

        </div>

        <button

          class="lessonButton"

          id="testBtn${i}"

          ${!unlocked || !practiceComplete(i) || !buildComplete(i) ? "disabled":""}>

          ${

            passed

            ? "Retake Test"

            : practiceComplete(i) && buildComplete(i)

              ? "Take Test"

              : "Finish learning first"

          }

        </button>

      </div>

    `;

    list.appendChild(box);

    const learnBtn=$(`learnBtn${i}`);

    if(unlocked){

      learnBtn.onclick=()=>{

        currentLesson=i;

        startPractice(i);

      };

    }

    const testBtn=$(`testBtn${i}`);

    if(

      unlocked &&

      practiceComplete(i) &&

      buildComplete(i)

    ){

      testBtn.onclick=()=>{

        currentLesson=i;

        startTest(i);

      };

    }

  }

  const completed=

    Object.values(s.testsPassed)

      .filter(Boolean).length;

  $("courseProgress").style.width=

    ((completed/6)*100)+"%";

  $("courseStatus").textContent=

    completed>=6

      ? "All lessons complete 🎉"

      : `Lesson ${Math.min(s.unlockedLesson+1,6)} of 6`;

}

/* =========================================================

   PRACTICE

========================================================= */

function startPractice(lessonIndex){

  currentLesson=lessonIndex;

  $("practiceTitle").textContent=

    lessonData(lessonIndex).name+

    " — Multiple Choice";

  openTab("practice");

  newPracticeQuestion();

}

function newPracticeQuestion(){

  const lesson=lessonData(currentLesson);

  const incomplete=lesson.items.filter(

    item=>practiceCount(item)<3

  );

  /*

    If all are complete, go to building.

  */

  if(!incomplete.length){

    ensureLesson(currentLesson);

    s.lessonProgress[currentLesson]

      .practiceDone=true;

    save();

    $("feedback").textContent=

      "Practice complete! 🧩";

    setTimeout(()=>{

      startBuild(currentLesson);

    },700);

    return;

  }

  const item=rand(incomplete);

  const right=item[1];

  let wrongs=shuffle(

    lesson.items

      .filter(x=>x!==item)

      .map(x=>x[1])

  ).slice(0,3);

  while(wrongs.length<3){

    wrongs.push(

      [

        "g / k",

        "n",

        "d / t",

        "r / l",

        "m",

        "b / p",

        "s",

        "ng / silent",

        "j",

        "ch",

        "k",

        "t",

        "p",

        "h",

        "a",

        "ya",

        "eo",

        "yeo",

        "o",

        "yo",

        "u",

        "yu",

        "eu",

        "i",

        "ae",

        "e"

      ][Math.floor(Math.random()*26)]

    );

  }

  const choices=shuffle(

    [right,...wrongs]

  );

  practiceState={

    item:item,

    right:right,

    selected:null,

    locked:false

  };

  $("prompt").textContent=

    "Which sound does this letter make?";

  $("big").textContent=item[0];

  $("practiceStatus").textContent=

    `This character: ${practiceCount(item)}/3 correct`;

  const answers=$("answers");

  answers.innerHTML="";

  choices.forEach(choice=>{

    const b=document.createElement("button");

    b.className="answer";

    b.textContent=choice;

    b.onclick=()=>{

      if(practiceState.locked)return;

      document.querySelectorAll("#answers .answer")

        .forEach(x=>x.classList.remove("selected"));

      b.classList.add("selected");

      practiceState.selected=b;

      $("checkPractice").disabled=false;

    };

    answers.appendChild(b);

  });

  $("feedback").textContent="";

  $("checkPractice").disabled=true;

}

$("checkPractice").onclick=()=>{

  if(

    practiceState.locked ||

    !practiceState.selected

  )return;

  practiceState.locked=true;

  const selected=

    practiceState.selected.textContent.trim();

  const right=

    practiceState.right.trim();

  s.total++;

  if(selected===right){

    s.correct++;

    s.streak++;

    const k=keyFor(

      practiceState.item

    );

    s.practiceProgress[k]=

      practiceCount(practiceState.item)+1;

    practiceState.selected.classList.add("correct");

    $("feedback").innerHTML=

      `<span class="good">Correct! ✓ ${practiceCount(practiceState.item)}/3</span>`;

  }else{

    s.streak=0;

    practiceState.selected.classList.add("wrong");

    document.querySelectorAll("#answers .answer")

      .forEach(x=>{

        if(x.textContent.trim()===right){

          x.classList.add("correct");

        }

      });

    $("feedback").innerHTML=

      `<span class="bad">Not quite — ${right}</span>`;

  }

  save();

  setTimeout(()=>{

    newPracticeQuestion();

  },1000);

};

/* =========================================================

   BUILDING BLOCKS

========================================================= */

function startBuild(lessonIndex){

  currentLesson=lessonIndex;

  openTab("build");

  $("buildStatus").textContent=

    lessonData(lessonIndex).name+

    " — Build each item 2 times";

  newBuildQuestion();

}

function getBuildTarget(item){

  const char=item[0];

  if(jamoBuild[char]){

    return char;

  }

  if(consonantToSyllable[char]){

    return consonantToSyllable[char];

  }

  if(vowelToSyllable[char]){

    return vowelToSyllable[char];

  }

  return char;

}

function getPartsFor(item){

  const target=getBuildTarget(item);

  if(jamoBuild[target]){

    return jamoBuild[target];

  }

  return [target];

}

function newBuildQuestion(){

  const lesson=lessonData(currentLesson);

  const incomplete=lesson.items.filter(

    item=>buildCount(item)<2

  );

  if(!incomplete.length){

    ensureLesson(currentLesson);

    s.lessonProgress[currentLesson]

      .buildDone=true;

    save();

    $("buildFeedback").innerHTML=

      `<span class="good">

        Building Blocks complete! ✓

      </span>`;

    setTimeout(()=>{

      startTest(currentLesson);

    },800);

    return;

  }

  const item=rand(incomplete);

  const target=getBuildTarget(item);

  const parts=getPartsFor(item);

  buildState={

    item:item,

    target:target,

    needed:parts,

    picked:[],

    count:buildCount(item),

    locked:false

  };

  $("buildResult").textContent="";

  $("bs1").textContent="?";

  $("bs2").textContent="?";

  $("buildFeedback").textContent="";

  renderBuildChoices();

}

function renderBuildChoices(){

  const choices=$("buildChoices");

  choices.innerHTML="";

  const lesson=lessonData(currentLesson);

  let pool=[];

  /*

    Put all relevant jamo into the random choices.

  */

  lesson.items.forEach(item=>{

    const parts=getPartsFor(item);

    parts.forEach(p=>{

      if(!pool.includes(p)){

        pool.push(p);

      }

    });

  });

  buildState.needed.forEach(p=>{

    if(!pool.includes(p)){

      pool.push(p);

    }

  });

  pool=shuffle(pool).slice(0,8);

  buildState.needed.forEach(p=>{

    if(!pool.includes(p)){

      pool[Math.floor(Math.random()*pool.length)]=p;

    }

  });

  pool=shuffle(pool);

  pool.forEach(choice=>{

    const b=document.createElement("button");

    b.className="buildChoice";

    b.textContent=choice;

    b.onclick=()=>chooseBuildPart(choice,b);

    choices.appendChild(b);

  });

}

function chooseBuildPart(choice,button){

  if(buildState.locked)return;

  const expected=

    buildState.needed[

      buildState.picked.length

    ];

  if(choice!==expected){

    buildState.locked=true;

    $("buildFeedback").innerHTML=

      `<span class="bad">

        Try again — the build was ${buildState.target}

      </span>`;

    setTimeout(()=>{

      newBuildQuestion();

    },900);

    return;

  }

  buildState.picked.push(choice);

  button.classList.add("selected");

  if(buildState.picked.length===1){

    $("bs1").textContent=choice;

  }

  if(buildState.picked.length===2){

    $("bs2").textContent=choice;

    const k=keyFor(buildState.item);

    s.buildProgress[k]=

      buildCount(buildState.item)+1;

    save();

    $("buildResult").textContent=

      buildState.target;

    $("buildFeedback").innerHTML=

      `<span class="good">

        Correct! ✓ ${buildCount(buildState.item)}/2

      </span>`;

    buildState.locked=true;

    setTimeout(()=>{

      newBuildQuestion();

    },800);

  }

}

/* =========================================================

   TEST

========================================================= */

function startTest(lessonIndex){

  if(

    !practiceComplete(lessonIndex) ||

    !buildComplete(lessonIndex)

  ){

    return;

  }

  currentLesson=lessonIndex;

  openTab("test");

  const lesson=lessonData(lessonIndex);

  const letterTasks=lesson.items.map(

    item=>({

      type:"letter",

      item:item

    })

  );

  const buildTasks=lesson.items.map(

    item=>({

      type:"build",

      item:item

    })

  );

  /*

    Every character exactly once in each half,

    then the entire test is randomized.

  */

  testState={

    lesson:lessonIndex,

    tasks:shuffle([

      ...letterTasks,

      ...buildTasks

    ]),

    index:0,

    correct:0,

    locked:false

  };

  $("testTitle").textContent=

    testData(lessonIndex).name;

  renderTestTask();

}

function renderTestTask(){

  if(testState.index>=testState.tasks.length){

    finishTest();

    return;

  }

  testState.locked=false;

  const task=

    testState.tasks[testState.index];

  $("testProgress").textContent=

    `Question ${testState.index+1} of ${testState.tasks.length}`;

  $("testFeedback").textContent="";

  const area=$("testArea");

  area.innerHTML="";

  if(task.type==="letter"){

    renderTestLetter(task,area);

  }else{

    renderTestBuild(task,area);

  }

}

function renderTestLetter(task,area){

  const item=task.item;

  const right=item[1];

  const title=document.createElement("div");

  title.className="testType";

  title.textContent=

    "What sound does this letter make?";

  area.appendChild(title);

  const big=document.createElement("div");

  big.className="testBig";

  big.textContent=item[0];

  area.appendChild(big);

  const choices=document.createElement("div");

  choices.className="testChoices";

  let wrongs=shuffle(

    lessonData(testState.lesson).items

      .filter(x=>x!==item)

      .map(x=>x[1])

  ).slice(0,3);

  const all=shuffle(

    [right,...wrongs]

  );

  all.forEach(choice=>{

    const b=document.createElement("button");

    b.className="answer";

    b.textContent=choice;

    b.onclick=()=>{

      if(testState.locked)return;

      testState.locked=true;

      const correct=choice===right;

      if(correct){

        testState.correct++;

        b.classList.add("correct");

        $("testFeedback").innerHTML=

          `<span class="good">Correct! ✓</span>`;

      }else{

        b.classList.add("wrong");

        document.querySelectorAll(

          ".testChoices .answer"

        ).forEach(x=>{

          if(x.textContent===right){

            x.classList.add("correct");

          }

        });

        $("testFeedback").innerHTML=

          `<span class="bad">The answer was ${right}</span>`;

      }

      setTimeout(()=>{

        testState.index++;

        renderTestTask();

      },850);

    };

    choices.appendChild(b);

  });

  area.appendChild(choices);

}

function renderTestBuild(task,area){

  const item=task.item;

  const target=getBuildTarget(item);

  const parts=getPartsFor(item);

  const title=document.createElement("div");

  title.className="testType";

  title.textContent=

    "Build this syllable";

  area.appendChild(title);

  const targetDisplay=document.createElement("div");

  targetDisplay.className="testBig";

  targetDisplay.textContent=target;

  area.appendChild(targetDisplay);

  const info=document.createElement("div");

  info.className="small center";

  info.textContent=

    "Choose the building blocks in order.";

  area.appendChild(info);

  const slots=document.createElement("div");

  slots.className="testBuild";

  const slot1=document.createElement("div");

  slot1.className="testBuildBox";

  slot1.textContent="?";

  const plus=document.createElement("div");

  plus.textContent="+";

  const slot2=document.createElement("div");

  slot2.className="testBuildBox";

  slot2.textContent="?";

  slots.appendChild(slot1);

  slots.appendChild(plus);

  slots.appendChild(slot2);

  area.appendChild(slots);

  const choices=document.createElement("div");

  choices.className="testChoices";

  let pool=[];

  lessonData(testState.lesson).items

    .forEach(x=>{

      getPartsFor(x).forEach(p=>{

        if(!pool.includes(p)){

          pool.push(p);

        }

      });

    });

  parts.forEach(p=>{

    if(!pool.includes(p)){

      pool.push(p);

    }

  });

  pool=shuffle(pool).slice(0,4);

  parts.forEach(p=>{

    if(!pool.includes(p)){

      pool[0]=p;

    }

  });

  pool=shuffle(pool);

  let picked=[];

  pool.forEach(choice=>{

    const b=document.createElement("button");

    b.className="answer";

    b.textContent=choice;

    b.onclick=()=>{

      if(testState.locked)return;

      const expected=parts[picked.length];

      if(choice!==expected){

        testState.locked=true;

        b.classList.add("wrong");

        $("testFeedback").innerHTML=

          `<span class="bad">

            Incorrect — ${target}

          </span>`;

        setTimeout(()=>{

          testState.index++;

          renderTestTask();

        },850);

        return;

      }

      b.classList.add("correct");

      picked.push(choice);

      if(picked.length===1){

        slot1.textContent=choice;

      }

      if(picked.length===2){

        slot2.textContent=choice;

        testState.correct++;

        testState.locked=true;

        $("testFeedback").innerHTML=

          `<span class="good">

            Correct! ✓

          </span>`;

        setTimeout(()=>{

          testState.index++;

          renderTestTask();

        },850);

      }

    };

    choices.appendChild(b);

  });

  area.appendChild(choices);

}

function finishTest(){

  const total=testState.tasks.length;

  const percent=

    Math.round(

      (testState.correct/total)*100

    );

  $("testProgress").textContent=

    `Score: ${percent}%`;

  if(percent>=70){

    s.testsPassed[testState.lesson]=true;

    /*

      Unlock the next lesson.

    */

    if(testState.lesson<5){

      s.unlockedLesson=

        Math.max(

          s.unlockedLesson,

          testState.lesson+1

        );

    }

    save();

    $("testArea").innerHTML=`

      <div class="center">

        <div style="font-size:70px">🎉</div>

        <div style="font-size:23px;font-weight:750">

          Test Passed!

        </div>

        <div class="small" style="margin:7px 0 16px">

          ${percent}% — You passed with 70% or higher.

        </div>

        <button

          class="primary"

          id="continueAfterTest">

          Continue

        </button>

      </div>

    `;

    $("continueAfterTest").onclick=()=>{

      renderLessons();

      openTab("learn");

    };

  }else{

    $("testArea").innerHTML=`

      <div class="center">

        <div style="font-size:65px">📚</div>

        <div style="font-size:23px;font-weight:750">

          Keep Practicing

        </div>

        <div class="small" style="margin:7px 0 16px">

          You scored ${percent}%. You need 70%.

        </div>

        <button

          class="primary"

          id="retryTest">

          Retake Test

        </button>

      </div>

    `;

    $("retryTest").onclick=()=>{

      startTest(testState.lesson);

    };

  }

}

/* =========================================================

   WRITING TARGETS

========================================================= */

/*

  IMPORTANT:

  Before a lesson's test is passed:

      its characters are individual letters.

  After the test is passed:

      the basic consonants/vowels become combined

      syllable blocks.

  Therefore a completed Consonants 1 section becomes:

      가 나 다 라 마 바 사

  instead of:

      ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ

*/

function writingTargets(){

  const result=[];

  /*

    Only use the lessons that have been unlocked.

    Current/uncompleted learning stays as individual letters.

  */

  for(let i=0;i<=s.unlockedLesson && i<6;i++){

    const lesson=lessonData(i);

    const passed=isTestPassed(i);

    lesson.items.forEach(item=>{

      const char=item[0];

      let target=item;

      /*

        Consonants 1 / 2

      */

      if(

        passed &&

        consonantToSyllable[char]

      ){

        const syllable=

          consonantToSyllable[char];

        target=[

          syllable,

          jamoBuild[syllable]

            ? syllable

            : item[1]

        ];

      }

      /*

        Vowels 1 / 2

      */

      if(

        passed &&

        vowelToSyllable[char]

      ){

        const syllable=

          vowelToSyllable[char];

        target=[

          syllable,

          item[1]

        ];

      }

      /*

        Syllable Blocks and Reading remain

        syllable/reading targets.

      */

      if(!result.some(x=>x[0]===target[0])){

        result.push(target);

      }

    });

  }

  return result;

}

function startWriting(){

  const targets=writingTargets();

  if(!targets.length){

    return;

  }

  /*

    Keep current target if it is still available.

    Otherwise choose a random one.

  */

  const available=targets.filter(

    item=>writingCount(item[0])<3

  );

  if(!available.length){

    $("writeTarget").textContent=

      "Writing complete 🎉";

    $("writeAttempt").textContent=

      "All available characters have 3 readable drawings.";

    return;

  }

  if(

    !writeState.target ||

    writingCount(writeState.target[0])>=3 ||

    !available.some(

      x=>x[0]===writeState.target[0]

    )

  ){

    chooseNewWriteTarget(available);

  }

  updateWritingUI();

}

function chooseNewWriteTarget(available=null){

  const pool=

    available ||

    writingTargets().filter(

      item=>writingCount(item[0])<3

    );

  if(!pool.length)return;

  writeState.target=rand(pool);

  /*

    This is the number of successful drawings

    already accumulated for THIS character.

  */

  writeState.success=

    writingCount(

      writeState.target[0]

    );

  writeState.attempts=0;

  clearCanvas();

  updateWritingUI();

}

function updateWritingUI(){

  if(!writeState.target)return;

  const char=writeState.target[0];

  const count=writingCount(char);

  $("writeTarget").textContent=

    char;

  $("writeAttempt").textContent=

    `${count}/3 readable drawings`;

  $("guideText").textContent=char;

  $("guide").style.display=

    writeState.mode==="trace"

      ? "block"

      : "none";

}

/* =========================================================

   TRACE / WRITE TOGGLE

========================================================= */

$("traceMode").onclick=()=>{

  writeState.mode="trace";

  $("traceMode").classList.add("active");

  $("writeMode").classList.remove("active");

  updateWritingUI();

};

$("writeMode").onclick=()=>{

  writeState.mode="write";

  $("writeMode").classList.add("active");

  $("traceMode").classList.remove("active");

  updateWritingUI();

};

/* =========================================================

   CANVAS

========================================================= */

const canvas=$("canvas");

const ctx=canvas.getContext("2d");

let cssSize=500;

function resizeCanvas(){

  const rect=canvas.getBoundingClientRect();

  const dpr=

    Math.max(1,window.devicePixelRatio||1);

  cssSize=rect.width;

  canvas.width=

    Math.round(rect.width*dpr);

  canvas.height=

    Math.round(rect.height*dpr);

  ctx.setTransform(

    dpr,0,0,dpr,0,0

  );

  ctx.lineCap="round";

  ctx.lineJoin="round";

  ctx.lineWidth=13;

  ctx.strokeStyle="#111";

}

window.addEventListener(

  "resize",

  resizeCanvas

);

resizeCanvas();

function pointerPosition(e){

  const rect=canvas.getBoundingClientRect();

  return {

    x:e.clientX-rect.left,

    y:e.clientY-rect.top

  };

}

canvas.addEventListener(

  "pointerdown",

  e=>{

    e.preventDefault();

    canvas.setPointerCapture(e.pointerId);

    const p=pointerPosition(e);

    writeState.drawing=true;

    writeState.lastX=p.x;

    writeState.lastY=p.y;

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);

    ctx.lineTo(

      p.x+.1,

      p.y+.1

    );

    ctx.stroke();

  }

);

canvas.addEventListener(

  "pointermove",

  e=>{

    if(!writeState.drawing)return;

    e.preventDefault();

    const p=pointerPosition(e);

    ctx.beginPath();

    ctx.moveTo(

      writeState.lastX,

      writeState.lastY

    );

    ctx.lineTo(p.x,p.y);

    ctx.stroke();

    writeState.lastX=p.x;

    writeState.lastY=p.y;

  }

);

canvas.addEventListener(

  "pointerup",

  e=>{

    writeState.drawing=false;

  }

);

canvas.addEventListener(

  "pointercancel",

  e=>{

    writeState.drawing=false;

  }

);

function clearCanvas(){

  ctx.clearRect(

    0,

    0,

    canvas.clientWidth,

    canvas.clientHeight

  );

}

/* =========================================================

   WRITING RECOGNITION

========================================================= */

function writingScore(){

  /*

    Downsample both the user's drawing and the target.

    The target is intentionally made thicker and the

    comparison uses a generous tolerance.

  */

  const size=100;

  const source=document.createElement("canvas");

  source.width=size;

  source.height=size;

  const sc=source.getContext("2d");

  sc.fillStyle="#fff";

  sc.fillRect(

    0,0,size,size

  );

  /*

    Scale the user's canvas into the 100x100 image.

  */

  sc.drawImage(

    canvas,

    0,0,

    canvas.width,

    canvas.height,

    0,0,

    size,size

  );

  const userData=

    sc.getImageData(

      0,0,size,size

    ).data;

  /*

    Render the target.

    Use a very thick target so recognition is forgiving.

  */

  const target=document.createElement("canvas");

  target.width=size;

  target.height=size;

  const tc=target.getContext("2d");

  tc.fillStyle="#fff";

  tc.fillRect(

    0,0,size,size

  );

  tc.fillStyle="#000";

  tc.textAlign="center";

  tc.textBaseline="middle";

  tc.font=

    '500 74px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';

  tc.fillText(

    writeState.target[0],

    size/2,

    size/2

  );

  const targetData=

    tc.getImageData(

      0,0,size,size

    ).data;

  /*

    Convert images into binary masks.

  */

  const userMask=

    new Uint8Array(size*size);

  const targetMask=

    new Uint8Array(size*size);

  for(let i=0;i<size*size;i++){

    const ui=i*4;

    /*

      Any dark-ish user pixel counts.

    */

    if(userData[ui]<235){

      userMask[i]=1;

    }

    /*

      Target.

    */

    if(targetData[ui]<240){

      targetMask[i]=1;

    }

  }

  let userPixels=0;

  let targetPixels=0;

  for(let i=0;i<userMask.length;i++){

    userPixels+=userMask[i];

    targetPixels+=targetMask[i];

  }

  /*

    Empty drawing.

  */

  if(userPixels<15){

    return 0;

  }

  /*

    Expand both masks with a generous radius.

  */

  const tolerance=5;

  function near(mask,x,y){

    for(

      let yy=-tolerance;

      yy<=tolerance;

      yy++

    ){

      for(

        let xx=-tolerance;

        xx<=tolerance;

        xx++

      ){

        const nx=x+xx;

        const ny=y+yy;

        if(

          nx<0 ||

          ny<0 ||

          nx>=size ||

          ny>=size

        )continue;

        if(

          xx*xx+yy*yy <=

          tolerance*tolerance &&

          mask[ny*size+nx]

        ){

          return true;

        }

      }

    }

    return false;

  }

  /*

    How much of the user's stroke is near the

    actual character?

  */

  let userNear=0;

  for(let y=0;y<size;y++){

    for(let x=0;x<size;x++){

      const i=y*size+x;

      if(

        userMask[i] &&

        near(targetMask,x,y)

      ){

        userNear++;

      }

    }

  }

  /*

    How much of the target is covered by

    the user's stroke?

  */

  let targetNear=0;

  for(let y=0;y<size;y++){

    for(let x=0;x<size;x++){

      const i=y*size+x;

      if(

        targetMask[i] &&

        near(userMask,x,y)

      ){

        targetNear++;

      }

    }

  }

  const precision=

    userNear/Math.max(1,userPixels);

  const coverage=

    targetNear/Math.max(1,targetPixels);

  /*

    Coverage matters more than exact precision.

    This makes the recognition much more forgiving.

  */

  let score=

    coverage*.75+

    precision*.25;

  /*

    Small bonus for having a reasonable amount

    of the target represented.

  */

  if(coverage>=.55){

    score+=.08;

  }

  if(coverage>=.75){

    score+=.05;

  }

  return Math.min(

    1,

    score

  );

}

/* =========================================================

   WRITING CHECK

========================================================= */

$("checkWrite").onclick=()=>{

  if(!writeState.target)return;

  const score=

    writingScore();

  const percent=

    Math.round(score*100);

  const char=

    writeState.target[0];

  writeState.attempts++;

  if(percent>=70){

    /*

      SUCCESS:

      Add ONE to this character's total.

      It does NOT need to be consecutive.

    */

    s.writingProgress[char]=

      writingCount(char)+1;

    save();

    $("writeFeedback").innerHTML=

      `<span class="good">

        Readable! ✓ ${writingCount(char)}/3

        (${percent}%)

      </span>`;

  }else{

    /*

      WRONG:

      Do NOT remove any previous successful progress.

      Do NOT reset the character.

      Just move on.

    */

    $("writeFeedback").innerHTML=

      `<span class="bad">

        Practice more — ${percent}%

      </span>`;

  }

  /*

    IMPORTANT:

    Whether RIGHT or WRONG, always go to

    another random character after the result.

  */

  setTimeout(()=>{

    const targets=

      writingTargets().filter(

        item=>writingCount(item[0])<3

      );

    if(!targets.length){

      $("writeTarget").textContent=

        "Writing complete 🎉";

      $("writeAttempt").textContent=

        "You've reached 3 readable drawings for everything available.";

      clearCanvas();

      return;

    }

    /*

      Prefer a different character when possible.

    */

    let choices=targets.filter(

      item=>item[0]!==char

    );

    if(!choices.length){

      choices=targets;

    }

    chooseNewWriteTarget(choices);

    $("writeFeedback").textContent="";

  },1100);

};

/* =========================================================

   REVIEW

========================================================= */

function renderReview(){

  $("statCorrect").textContent=

    s.correct;

  $("statTotal").textContent=

    s.total;

  $("statStreak").textContent=

    s.streak;

  const list=$("reviewList");

  list.innerHTML="";

  for(let i=0;i<6;i++){

    const lesson=lessonData(i);

    lesson.items.forEach(item=>{

      const char=item[0];

      const row=document.createElement("div");

      row.className="reviewItem";

      row.innerHTML=`

        <div>

          <div class="char">${char}</div>

          <div class="small">${item[1]}</div>

        </div>

        <div style="text-align:right">

          <div class="small">

            MC: ${practiceCount(item)}/3

          </div>

          <div class="small">

            Build: ${buildCount(item)}/2

          </div>

          <div class="small">

            Write: ${writingCount(char)}/3

          </div>

        </div>

      `;

      list.appendChild(row);

    });

  }

}

/* =========================================================

   SOUND

========================================================= */

function speak(text){

  if(!("speechSynthesis" in window)){

    return;

  }

  speechSynthesis.cancel();

  const u=

    new SpeechSynthesisUtterance(text);

  u.lang="ko-KR";

  u.rate=.75;

  speechSynthesis.speak(u);

}

$("soundBtn").onclick=()=>{

  if(practiceState.item){

    speak(

      practiceState.item[0]

    );

  }else if(writeState.target){

    speak(

      writeState.target[0]

    );

  }

};

/* =========================================================

   INITIALIZE

========================================================= */

for(let i=0;i<6;i++){

  ensureLesson(i);

}

renderLessons();

renderReview();

startWriting();

</script>
