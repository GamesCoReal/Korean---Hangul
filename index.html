<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hangul Quest</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
              "SF Pro Text",Arial,sans-serif;
  background:#f2f2f7;
  color:#111;
}

body{
  padding-bottom:90px;
}

button{
  font:inherit;
  border:none;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px 14px 30px;
}

header{
  padding:8px 4px 18px;
}

h1{
  margin:0;
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.2px;
}

.subtitle{
  color:#6e6e73;
  margin-top:4px;
  font-size:15px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 0 14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  padding:10px 17px;
  border-radius:20px;
  background:#e5e5ea;
  color:#555;
  font-weight:700;
}

.tab.active{
  background:#111;
  color:white;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.lesson{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.lessonInfo{
  min-width:0;
  flex:1;
}

.lessonName{
  font-size:20px;
  font-weight:800;
}

.lessonDesc{
  margin-top:4px;
  color:#777;
  font-size:14px;
}

.lessonStatus{
  margin-top:8px;
  font-size:13px;
  color:#777;
}

.lessonButton{
  padding:12px 16px;
  border-radius:15px;
  background:#111;
  color:white;
  font-weight:700;
}

.lessonButton:disabled{
  background:#d1d1d6;
  color:#777;
}

.sectionTitle{
  font-size:25px;
  font-weight:800;
  margin:8px 2px 14px;
}

.prompt{
  text-align:center;
  color:#777;
  font-size:15px;
  margin-bottom:5px;
}

.glyph{
  text-align:center;
  font-size:100px;
  line-height:1.05;
  font-weight:500;
  margin:8px 0 14px;
}

.soundButton{
  display:block;
  margin:0 auto 18px;
  background:#e5e5ea;
  border-radius:50%;
  width:48px;
  height:48px;
  font-size:21px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.choice{
  min-height:58px;
  padding:12px;
  border-radius:15px;
  background:#f2f2f7;
  font-size:20px;
  font-weight:700;
}

.choice.selected{
  background:#111;
  color:white;
}

.choice.correct{
  background:#34c759;
  color:white;
}

.choice.wrong{
  background:#ff3b30;
  color:white;
}

.checkButton{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  background:#111;
  color:white;
  font-weight:800;
  font-size:17px;
}

.checkButton:disabled{
  background:#d1d1d6;
  color:#777;
}

.feedback{
  min-height:25px;
  text-align:center;
  font-weight:800;
  margin-top:12px;
}

.feedback.good{
  color:#248a3d;
}

.feedback.bad{
  color:#d70015;
}

.stats{
  text-align:center;
  color:#777;
  margin-top:12px;
  font-size:14px;
}

.progressBar{
  height:8px;
  background:#e5e5ea;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progressFill{
  height:100%;
  width:0%;
  background:#111;
  transition:.25s;
}

.backButton{
  background:#e5e5ea;
  padding:10px 15px;
  border-radius:14px;
  font-weight:700;
  margin-bottom:14px;
}

/* BUILDING */

.builderTarget{
  text-align:center;
  font-size:64px;
  font-weight:700;
  margin:5px 0 15px;
}

.builderEquation{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-size:42px;
  font-weight:700;
  margin:15px 0 22px;
}

.builderPiece{
  min-width:65px;
  min-height:65px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f2f2f7;
  border-radius:17px;
}

.plus{
  color:#888;
}

.buildChoices{
  grid-template-columns:repeat(2,1fr);
}

.buildChoices button{
  font-size:32px;
}

.buildChoices button.selected{
  background:#111;
  color:white;
}

/* TEST */

.testCounter{
  text-align:center;
  color:#777;
  margin-bottom:10px;
}

.testScore{
  text-align:center;
  font-size:40px;
  font-weight:800;
  margin:15px 0;
}

/* WRITING */

.modeButtons{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.modeButton{
  flex:1;
  padding:12px;
  border-radius:14px;
  background:#e5e5ea;
  font-weight:800;
}

.modeButton.active{
  background:#111;
  color:white;
}

.writePrompt{
  text-align:center;
  color:#777;
  margin-bottom:5px;
}

.canvasWrap{
  width:min(100%,500px);
  aspect-ratio:1;
  margin:0 auto;
  position:relative;
  border-radius:22px;
  overflow:hidden;
  background:white;
  border:2px solid #ddd;
  touch-action:none;
}

.guide{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  pointer-events:none;
  color:rgba(120,120,120,.28);
  font-size:90%;
  line-height:1;
  font-weight:500;
}

#writeCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  background:transparent;
  touch-action:none;
}

.canvasGrid{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.25;
}

.canvasGrid::before,
.canvasGrid::after{
  content:"";
  position:absolute;
  background:#bbb;
}

.canvasGrid::before{
  width:1px;
  height:100%;
  left:50%;
}

.canvasGrid::after{
  width:100%;
  height:1px;
  top:50%;
}

.writeActions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.writeActions button{
  flex:1;
  padding:14px;
  border-radius:15px;
  font-weight:800;
}

.clearButton{
  background:#e5e5ea;
}

.checkWriteButton{
  background:#111;
  color:white;
}

.reviewInfo{
  color:#666;
  line-height:1.5;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}

.hidden{
  display:none !important;
}

@media(max-width:500px){
  .app{
    padding-left:11px;
    padding-right:11px;
  }

  h1{
    font-size:30px;
  }

  .glyph{
    font-size:86px;
  }

  .builderTarget{
    font-size:55px;
  }

  .builderEquation{
    font-size:34px;
  }

  .builderPiece{
    min-width:58px;
    min-height:58px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Hangul Quest 🇰🇷</h1>
  <div class="subtitle">Learn Korean one character at a time.</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="learn">Learn</button>
  <button class="tab" data-tab="practice">Practice</button>
  <button class="tab" data-tab="write">Write</button>
  <button class="tab" data-tab="review">Review</button>
</div>

<!-- LEARN -->
<section id="learnView">

  <div class="sectionTitle">Lessons</div>
  <div id="lessonList"></div>

</section>

<!-- PRACTICE -->
<section id="practiceView" class="hidden">

  <button class="backButton" onclick="showTab('learn')">← Lessons</button>

  <div id="practiceCard" class="card"></div>

  <div id="builderCard" class="card"></div>

</section>

<!-- TEST -->
<section id="testView" class="hidden">

  <button class="backButton" onclick="showTab('learn')">← Lessons</button>

  <div id="testCard" class="card"></div>

</section>

<!-- WRITE -->
<section id="writeView" class="hidden">

  <div class="sectionTitle">Writing Practice</div>

  <div class="card">

    <div class="modeButtons">
      <button id="traceModeButton"
              class="modeButton active"
              onclick="setWriteMode('trace')">
        Trace
      </button>

      <button id="writeModeButton"
              class="modeButton"
              onclick="setWriteMode('write')">
        Write
      </button>
    </div>

    <div id="writePrompt" class="writePrompt">
      Trace the character.
    </div>

    <div class="canvasWrap">

      <div class="canvasGrid"></div>

      <div id="guide"
           class="guide"></div>

      <canvas id="writeCanvas"></canvas>

    </div>

    <div class="writeActions">
      <button class="clearButton" onclick="clearCanvas()">
        Clear
      </button>

      <button class="checkWriteButton" onclick="checkWriting()">
        Check ✓
      </button>
    </div>

    <div id="writeFeedback" class="feedback"></div>

    <div id="writeStats" class="stats"></div>

  </div>

</section>

<!-- REVIEW -->
<section id="reviewView" class="hidden">

  <div class="sectionTitle">Review</div>

  <div class="card">
    <div id="reviewContent" class="reviewInfo"></div>
  </div>

</section>

</div>

<script>

/* =========================================================
   LESSON DATA
========================================================= */

const lessons = [

  {
    name:"Consonants 1",
    desc:"The first 7 consonants",
    items:[
      ["ㄱ","g / k"],
      ["ㄴ","n"],
      ["ㄷ","d / t"],
      ["ㄹ","r / l"],
      ["ㅁ","m"],
      ["ㅂ","b / p"],
      ["ㅅ","s"]
    ]
  },

  {
    name:"Consonants 2",
    desc:"More consonants",
    items:[
      ["ㅇ","ng / silent"],
      ["ㅈ","j"],
      ["ㅊ","ch"],
      ["ㅋ","k"],
      ["ㅌ","t"],
      ["ㅍ","p"],
      ["ㅎ","h"]
    ]
  },

  {
    name:"Vowels 1",
    desc:"Basic vowels",
    items:[
      ["ㅏ","a"],
      ["ㅑ","ya"],
      ["ㅓ","eo"],
      ["ㅕ","yeo"],
      ["ㅗ","o"],
      ["ㅛ","yo"],
      ["ㅜ","u"]
    ]
  },

  {
    name:"Vowels 2",
    desc:"The remaining basic vowels",
    items:[
      ["ㅠ","yu"],
      ["ㅡ","eu"],
      ["ㅣ","i"],
      ["ㅐ","ae"],
      ["ㅔ","e"]
    ]
  },

  {
    name:"Syllable Blocks 1",
    desc:"Combine consonants and vowels",
    items:[
      ["가","ga"],
      ["나","na"],
      ["다","da"],
      ["마","ma"],
      ["바","ba"],
      ["사","sa"]
    ]
  },

  {
    name:"Reading 1",
    desc:"Read simple Korean syllables",
    items:[
      ["너","neo"],
      ["미","mi"],
      ["고","go"],
      ["아","a"],
      ["우","u"],
      ["하","ha"]
    ]
  }

];


/* =========================================================
   BUILD MAPS
========================================================= */

const jamoBuild = {

  "가":["ㄱ","ㅏ"],
  "나":["ㄴ","ㅏ"],
  "다":["ㄷ","ㅏ"],
  "라":["ㄹ","ㅏ"],
  "마":["ㅁ","ㅏ"],
  "바":["ㅂ","ㅏ"],
  "사":["ㅅ","ㅏ"],

  "아":["ㅇ","ㅏ"],
  "자":["ㅈ","ㅏ"],
  "차":["ㅊ","ㅏ"],
  "카":["ㅋ","ㅏ"],
  "타":["ㅌ","ㅏ"],
  "파":["ㅍ","ㅏ"],
  "하":["ㅎ","ㅏ"],

  "야":["ㅇ","ㅑ"],
  "어":["ㅇ","ㅓ"],
  "여":["ㅇ","ㅕ"],
  "오":["ㅇ","ㅗ"],
  "요":["ㅇ","ㅛ"],
  "우":["ㅇ","ㅜ"],
  "유":["ㅇ","ㅠ"],
  "으":["ㅇ","ㅡ"],
  "이":["ㅇ","ㅣ"],
  "애":["ㅇ","ㅐ"],
  "에":["ㅇ","ㅔ"],

  "너":["ㄴ","ㅓ"],
  "미":["ㅁ","ㅣ"],
  "고":["ㄱ","ㅗ"]

};


const consonantToSyllable = {

  "ㄱ":"가",
  "ㄴ":"나",
  "ㄷ":"다",
  "ㄹ":"라",
  "ㅁ":"마",
  "ㅂ":"바",
  "ㅅ":"사",
  "ㅇ":"아",
  "ㅈ":"자",
  "ㅊ":"차",
  "ㅋ":"카",
  "ㅌ":"타",
  "ㅍ":"파",
  "ㅎ":"하"

};


const vowelToSyllable = {

  "ㅏ":"아",
  "ㅑ":"야",
  "ㅓ":"어",
  "ㅕ":"여",
  "ㅗ":"오",
  "ㅛ":"요",
  "ㅜ":"우",
  "ㅠ":"유",
  "ㅡ":"으",
  "ㅣ":"이",
  "ㅐ":"애",
  "ㅔ":"에"

};


/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY = "hangulQuest_v8";

let s = {

  correct:0,
  total:0,
  streak:0,

  unlocked:0,

  practice:{},
  building:{},
  writing:{},
  tests:{}

};


try{

  const saved = localStorage.getItem(STORAGE_KEY);

  if(saved){

    const parsed = JSON.parse(saved);

    s = {
      ...s,
      ...parsed,
      practice:parsed.practice || {},
      building:parsed.building || {},
      writing:parsed.writing || {},
      tests:parsed.tests || {}
    };

  }

}catch(e){}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(s)
  );

}


/* =========================================================
   GLOBALS
========================================================= */

let activeLesson = 0;

let practiceState = {
  item:null,
  askSound:false,
  selected:null,
  locked:false
};

let buildState = {
  item:null,
  target:null,
  parts:[],
  selected:[],
  locked:false
};

let testState = {
  lesson:0,
  tasks:[],
  index:0,
  score:0,
  locked:false
};

let writeMode = "trace";
let currentWriteTarget = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function shuffle(array){

  const a = [...array];

  for(let i=a.length-1;i>0;i--){

    const j = Math.floor(Math.random()*(i+1));

    [a[i],a[j]] = [a[j],a[i]];

  }

  return a;

}


function random(array){

  return array[
    Math.floor(Math.random()*array.length)
  ];

}


function itemKey(item){

  return item[0];

}


function practiceCount(item){

  return s.practice[itemKey(item)] || 0;

}


function buildCount(item){

  return s.building[itemKey(item)] || 0;

}


function writeCount(char){

  return s.writing[char] || 0;

}


function testPassed(index){

  return !!s.tests[index];
}


function lessonUnlocked(index){

  return index <= s.unlocked;
}


function practiceComplete(index){

  return lessons[index].items.every(
    item => practiceCount(item) >= 3
  );

}


function buildingComplete(index){

  return lessons[index].items.every(
    item => buildCount(item) >= 2
  );

}


function readyForTest(index){

  return (
    practiceComplete(index) &&
    buildingComplete(index)
  );

}


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(".tab").forEach(button=>{

  button.addEventListener("click",()=>{

    showTab(button.dataset.tab);

  });

});


function showTab(tab){

  document.querySelectorAll(".tab").forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.tab === tab
    );

  });

  $("learnView").classList.toggle(
    "hidden",
    tab !== "learn"
  );

  $("practiceView").classList.toggle(
    "hidden",
    tab !== "practice"
  );

  $("writeView").classList.toggle(
    "hidden",
    tab !== "write"
  );

  $("reviewView").classList.toggle(
    "hidden",
    tab !== "review"
  );

  $("testView").classList.toggle(
    "hidden",
    tab !== "test"
  );

  if(tab === "learn"){

    renderLessons();

  }

  if(tab === "write"){

    startWriting();

  }

  if(tab === "review"){

    renderReview();

  }

}


/* =========================================================
   LESSON LIST
========================================================= */

function renderLessons(){

  const list = $("lessonList");

  list.innerHTML = "";

  lessons.forEach((lesson,index)=>{

    const unlocked = lessonUnlocked(index);

    const practiceDone = practiceComplete(index);

    const buildDone = buildingComplete(index);

    const ready = readyForTest(index);

    const passed = testPassed(index);

    const card = document.createElement("div");

    card.className = "card";

    let status = "";

    if(!unlocked){

      status = "🔒 Locked";

    }else if(passed){

      status = "✅ Test passed";

    }else{

      status =
        `Multiple Choice: ${Math.min(
          100,
          Math.round(
            lessons[index].items.reduce(
              (a,item)=>a+Math.min(3,practiceCount(item)),
              0
            ) /
            (lesson.items.length*3) * 100
          )
        )}%`;

      if(buildDone){

        status += " • Building: ✅";

      }else{

        status += " • Building: ⏳";

      }

    }

    card.innerHTML = `

      <div class="lesson">

        <div class="lessonInfo">

          <div class="lessonName">
            ${index+1}. ${lesson.name}
          </div>

          <div class="lessonDesc">
            ${lesson.desc}
          </div>

          <div class="lessonStatus">
            ${status}
          </div>

        </div>

        <button
          class="lessonButton"
          ${unlocked ? "" : "disabled"}
          onclick="openLesson(${index})"
        >
          ${
            !unlocked
            ? "Locked"
            : passed
              ? "Review"
              : ready
                ? "Test"
                : "Learn"
          }
        </button>

      </div>

    `;

    list.appendChild(card);

  });

}


/* =========================================================
   OPEN LESSON
========================================================= */

function openLesson(index){

  if(!lessonUnlocked(index)) return;

  activeLesson = index;

  if(readyForTest(index) && !testPassed(index)){

    startTest(index);

    return;

  }

  startPractice(index);

  showTab("practice");

}


/* =========================================================
   PRACTICE
========================================================= */

function getIncompletePracticeItems(){

  return lessons[activeLesson].items.filter(
    item => practiceCount(item) < 3
  );

}


function startPractice(index){

  activeLesson = index;

  practiceState = {
    item:null,
    askSound:false,
    selected:null,
    locked:false
  };

  newPracticeQuestion();

  newBuildingQuestion();

  showTab("practice");

}


function makeAnswerChoices(item,askSound){

  const correct = askSound
    ? item[1]
    : item[0];

  const wrongPool = lessons[activeLesson].items

    .filter(x => x[0] !== item[0])

    .map(x => askSound ? x[1] : x[0]);

  const wrong = shuffle(wrongPool).slice(0,3);

  return shuffle([
    correct,
    ...wrong
  ]);

}


function newPracticeQuestion(){

  const incomplete = getIncompletePracticeItems();

  if(!incomplete.length){

    renderPracticeComplete();

    return;

  }

  const item = random(incomplete);

  const askSound = Math.random() < .5;

  practiceState.item = item;

  practiceState.askSound = askSound;

  practiceState.selected = null;

  practiceState.locked = false;

  const choices = makeAnswerChoices(
    item,
    askSound
  );

  const card = $("practiceCard");

  const prompt = askSound
    ? "Which sound matches this character?"
    : "Which Korean character matches this sound?";

  const main = askSound
    ? item[0]
    : item[1];

  card.innerHTML = `

    <div class="prompt">
      ${prompt}
    </div>

    <div class="glyph">
      ${main}
    </div>

    ${
      askSound
      ? `
        <button
          class="soundButton"
          onclick="speak('${item[1].replace(/'/g,"\\'")}')"
        >
          🔊
        </button>
      `
      : ""
    }

    <div class="choices" id="answerChoices"></div>

    <button
      id="practiceCheck"
      class="checkButton"
      disabled
      onclick="checkPracticeAnswer()"
    >
      Check ✓
    </button>

    <div id="practiceFeedback"
         class="feedback">
    </div>

    <div id="practiceStats"
         class="stats">
    </div>

  `;

  const choiceBox = $("answerChoices");

  choices.forEach(choice=>{

    const button = document.createElement("button");

    button.className = "choice";

    button.textContent = choice;

    button.onclick = ()=>{

      if(practiceState.locked) return;

      document
        .querySelectorAll("#answerChoices .choice")
        .forEach(b=>b.classList.remove("selected"));

      button.classList.add("selected");

      practiceState.selected = choice;

      $("practiceCheck").disabled = false;

    };

    choiceBox.appendChild(button);

  });

  updatePracticeStats();

}


function checkPracticeAnswer(){

  if(practiceState.locked) return;

  if(practiceState.selected === null) return;

  practiceState.locked = true;

  const item = practiceState.item;

  const correctAnswer = practiceState.askSound
    ? item[1]
    : item[0];

  const buttons =
    document.querySelectorAll(
      "#answerChoices .choice"
    );

  buttons.forEach(button=>{

    if(button.textContent === correctAnswer){

      button.classList.add("correct");

    }

    if(
      button.textContent === practiceState.selected &&
      practiceState.selected !== correctAnswer
    ){

      button.classList.add("wrong");

    }

  });

  const feedback = $("practiceFeedback");

  if(practiceState.selected === correctAnswer){

    s.practice[itemKey(item)] =
      practiceCount(item) + 1;

    s.correct++;

    s.streak++;

    feedback.textContent =
      `Correct! ${Math.min(
        3,
        practiceCount(item)

    s.total++;

    s.streak = 0;

    feedback.textContent =
      `Not quite — the answer is ${correctAnswer}`;

    feedback.className =
      "feedback bad";

    save();

  }

  updatePracticeStats();

  /*
    IMPORTANT:
    Whether RIGHT or WRONG, we move to another
    random incomplete character.
  */

  setTimeout(()=>{

    if(practiceComplete(activeLesson)){

      newBuildingQuestion();

    }else{

      newPracticeQuestion();

    }

    renderLessons();

  },900);

}

/* =========================================================
   BUILDING BLOCKS
========================================================= */

function buildTargetFor(item){

  const char = item[0];

  if(consonantToSyllable[char]){

    return consonantToSyllable[char];

  }

  if(vowelToSyllable[char]){

    return vowelToSyllable[char];

  }

  return char;

}


function buildPartsFor(item){

  const target = buildTargetFor(item);

  if(jamoBuild[target]){

    return jamoBuild[target];

  }

  return [target];

}


function getIncompleteBuildItems(){

  return lessons[activeLesson].items.filter(
    item => buildCount(item) < 2
  );

}


function getBuildingChoices(item){

  const requiredParts = buildPartsFor(item);

  let pool = [];

  lessons[activeLesson].items.forEach(other=>{

    buildPartsFor(other).forEach(part=>{

      if(!pool.includes(part)){

        pool.push(part);

      }

    });

  });

  requiredParts.forEach(part=>{

    if(!pool.includes(part)){

      pool.push(part);

    }

  });

  /*
    Four choices.

    Required pieces are ALWAYS included.
  */

  let choices = shuffle(pool).slice(0,4);

  requiredParts.forEach(part=>{

    if(!choices.includes(part)){

      choices[
        Math.floor(Math.random()*choices.length)
      ] = part;

    }

  });

  return shuffle(
    [...new Set(choices)]
  );

}


function newBuildingQuestion(){

  const incomplete = getIncompleteBuildItems();

  const card = $("builderCard");

  if(!incomplete.length){

    card.innerHTML = `

      <div class="empty">

        <div style="font-size:45px">🧱</div>

        <h2>Building Complete!</h2>

        <p>
          Every item has been built correctly twice.
        </p>

        ${
          readyForTest(activeLesson)
          ? `
            <button
              class="checkButton"
              onclick="startTest(${activeLesson})"
            >
              Take Test →
            </button>
          `
          : ""
        }

      </div>

    `;

    renderLessons();

    return;

  }

  const item = random(incomplete);

  const target = buildTargetFor(item);

  const parts = buildPartsFor(item);

  buildState = {

    item:item,

    target:target,

    parts:parts,

    selected:[],

    locked:false

  };

  const choices =
    getBuildingChoices(item);

  card.innerHTML = `

    <div class="prompt">
      Building Blocks
    </div>

    <div class="builderTarget">
      ${target}
    </div>

    <div class="builderEquation">

      <div id="buildPiece0"
           class="builderPiece">
        ?
      </div>

      <div class="plus">
        +
      </div>

      <div id="buildPiece1"
           class="builderPiece">
        ?
      </div>

    </div>

    <div
      id="buildChoices"
      class="choices buildChoices">
    </div>

    <div
      id="buildFeedback"
      class="feedback">
    </div>

    <div
      id="buildStats"
      class="stats">
    </div>

  `;

  const choiceBox =
    $("buildChoices");

  choices.forEach(choice=>{

    const button =
      document.createElement("button");

    button.className = "choice";

    button.textContent = choice;

    button.onclick = ()=>{

      chooseBuildingPart(
        choice,
        button
      );

    };

    choiceBox.appendChild(button);

  });

  updateBuildingStats();

}


function chooseBuildingPart(part,button){

  if(buildState.locked) return;

  const required =
    buildState.parts;

  /*
    Only add each piece once.
  */

  if(buildState.selected.includes(part)){

    return;

  }

  buildState.selected.push(part);

  button.classList.add("selected");

  updateBuilderEquation();

  /*
    When enough pieces have been chosen,
    automatically check the build.
  */

  if(buildState.selected.length >= required.length){

    checkBuilding();

  }

}


function updateBuilderEquation(){

  const a = $("buildPiece0");

  const b = $("buildPiece1");

  if(!a || !b) return;

  a.textContent =
    buildState.selected[0] || "?";

  b.textContent =
    buildState.selected[1] || "?";

}


function checkBuilding(){

  if(buildState.locked) return;

  buildState.locked = true;

  const required =
    buildState.parts;

  const selected =
    buildState.selected;

  const correct =
    selected.length === required.length &&
    selected.every(
      (part,index)=>
        part === required[index]
    );

  const feedback =
    $("buildFeedback");

  if(correct){

    s.building[itemKey(buildState.item)] =
      buildCount(buildState.item) + 1;

    s.correct++;

    feedback.textContent =
      `Correct! ${Math.min(
        2,
        buildCount(buildState.item)
      )}/2 builds`;

    feedback.className =
      "feedback good";

    save();

  }else{

    s.total++;

    s.streak = 0;

    feedback.textContent =
      `Not quite — ${required.join(" + ")}`;

    feedback.className =
      "feedback bad";

    save();

  }

  updateBuildingStats();

  /*
    RIGHT OR WRONG:
    move to another random build.
  */

  setTimeout(()=>{

    newBuildingQuestion();

    renderLessons();

  },900);

}


function updateBuildingStats(){

  const total =
    lessons[activeLesson].items.length * 2;

  const done =
    lessons[activeLesson].items.reduce(
      (sum,item)=>
        sum + Math.min(2,buildCount(item)),
      0
    );

  const stats = $("buildStats");

  if(!stats) return;

  stats.innerHTML = `

    ${done}/${total} successful builds

    <div class="progressBar">

        class="progressFill"
        style="width:${(done/total)*100}%"
      ></div>

    </div>

  `;

}

function startTest(index){

  activeLesson = index;

  testState = {

    lesson:index,

    tasks:[],

    index:0,

    score:0,

    locked:false

  };

  /*
    Every item appears twice:
    1. Recognition
    2. Building
  */

  lessons[index].items.forEach(item=>{

    testState.tasks.push({
      type:"recognition",
      item:item
    });

    testState.tasks.push({
      type:"build",
      item:item
    });

  });

  testState.tasks =
    shuffle(testState.tasks);

  renderTestTask();

  showTab("test");

}


function renderTestTask(){

  const card = $("testCard");

  const task =
    testState.tasks[testState.index];

  if(!task){

    finishTest();

    return;

  }

  testState.locked = false;

  if(task.type === "recognition"){

    renderLetterTest(task.item);

  }else{

    renderBuildTest(task.item);

  }

}

    .querySelectorAll("#testChoices .choice")

const COMBINED_REVIEW_DAYS = 7;


/*
  A section becomes combined-writing practice after
  passing its test.

  After 7 days, it returns to individual letters
  for spaced review.
*/

function sectionIsCurrentlyCombined(index){

  if(!testPassed(index)){

    return false;

  }

  const lastReview =
    s.tests[index + "_review"];

  if(!lastReview){

    return true;

  }

  const age =
    Date.now() - lastReview;

  const days =
    age / 86400000;

  return days < COMBINED_REVIEW_DAYS;

}


function writingTargets(){

  let targets = [];

  for(let i=0;i<lessons.length;i++){

    if(!lessonUnlocked(i)) continue;

    const lesson =
      lessons[i];

    if(
      i < 4 &&
      sectionIsCurrentlyCombined(i)
    ){

      /*
        Consonants become syllables:
        ㄱ -> 가

        Vowels become:
        ㅏ -> 아
      */

      lesson.items.forEach(item=>{

        let target = null;

        if(consonantToSyllable[item[0]]){

          target =
            consonantToSyllable[item[0]];

        }else if(vowelToSyllable[item[0]]){

          target =
            vowelToSyllable[item[0]];

        }

        if(target){

          targets.push({
            char:target,
            sourceSection:i
          });

        }

      });

    }else{

      lesson.items.forEach(item=>{

        targets.push({
          char:item[0],
          sourceSection:i
        });

      });

    }

  }

  /*
    Remove duplicates.
  */

  const seen = new Set();

  return targets.filter(obj=>{

    if(seen.has(obj.char)){

      return false;

    }

    seen.add(obj.char);

    return true;

  });

}


function getIncompleteWritingTargets(){

  return writingTargets().filter(
    obj => writeCount(obj.char) < 3
  );

}


function startWriting(){

  const targets =
    getIncompleteWritingTargets();

  if(!targets.length){

    $("writePrompt").textContent =
      "All currently available characters completed! 🎉";

    $("writeStats").textContent = "";

    $("guide").textContent = "";

    return;

  }

  chooseNewWritingTarget();

}


function chooseNewWritingTarget(){

  const targets =
    getIncompleteWritingTargets();

  if(!targets.length){

    currentWriteTarget = null;

    updateWritingUI();

    return;

  }

  /*
    Try not to immediately repeat the same character
    when more than one is available.
  */

  let pool = targets;

  if(
    currentWriteTarget &&
    targets.length > 1
  ){

    pool = targets.filter(
      x =>
        x.char !== currentWriteTarget.char
    );

  }

  currentWriteTarget =
    random(pool);

  clearCanvas();

  updateWritingUI();

}


function updateWritingUI(){

  const guide =
    $("guide");

  if(!currentWriteTarget){

    guide.textContent = "";

    return;

  }

  guide.textContent =
    writeMode === "trace"
    ? currentWriteTarget.char
    : "";

  $("writePrompt").textContent =
    writeMode === "trace"
    ? `Trace ${currentWriteTarget.char}`
    : `Write ${currentWriteTarget.char} from memory`;

  $("writeStats").textContent =
    `${Math.min(
      3,
      writeCount(currentWriteTarget.char)
    )}/3 successful drawings`;

}


function setWriteMode(mode){

  writeMode = mode;

  $("traceModeButton")
    .classList.toggle(
      "active",
      mode === "trace"
    );

  $("writeModeButton")
    .classList.toggle(
      "active",
      mode === "write"
    );

  updateWritingUI();

}


const canvas =
  $("writeCanvas");

const ctx =
  canvas.getContext("2d");


function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.lineCap = "round";

  ctx.lineJoin = "round";

  ctx.lineWidth = 8;

  ctx.strokeStyle = "#111";

}


window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


let drawing = false;


function getCanvasPoint(event){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      event.clientX - rect.left,

    y:
      event.clientY - rect.top

  };

}


canvas.addEventListener(
  "pointerdown",
  event=>{

    drawing = true;

    canvas.setPointerCapture(
      event.pointerId
    );

    const p =
      getCanvasPoint(event);

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y
    );

  }
);


canvas.addEventListener(
  "pointermove",
  event=>{

    if(!drawing) return;

    const p =
      getCanvasPoint(event);

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

  }
);


canvas.addEventListener(
  "pointerup",
  ()=>{
    drawing = false;
  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{
    drawing = false;
  }
);


function clearCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );

}


/* =========================================================
   WRITING RECOGNITION
========================================================= */

function canvasMask(){

  const size = 100;

  const off =
    document.createElement("canvas");

  off.width = size;

  off.height = size;

  const octx =
    off.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  /*
    Draw user's canvas into a 100x100 mask.
  */

  octx.drawImage(
    canvas,
    0,
    0,
    size,
    size
  );

  const data =
    octx.getImageData(
      0,
      0,
      size,
      size
    ).data;

  const mask =
    new Uint8Array(
      size*size
    );

  for(let i=0;i<mask.length;i++){

    const alpha =
      data[i*4+3];

    const r =
      data[i*4];

    const g =
      data[i*4+1];

    const b =
      data[i*4+2];

    /*
      Treat dark pixels as handwriting.
    */

    if(
      alpha > 30 &&
      (r+g+b) < 650
    ){

      mask[i] = 1;

    }

  }

  return mask;

}


function makeTargetMask(char){

  const size = 100;

  const off =
    document.createElement("canvas");

  off.width = size;

  off.height = size;

  const octx =
    off.getContext("2d");

  octx.fillStyle = "#000";

  octx.font =
    '70px "Arial Unicode MS", "Noto Sans KR", sans-serif';

  octx.textAlign = "center";

  octx.textBaseline = "middle";

  octx.fillText(
    char,
    size/2,
    size/2
  );

  const data =
    octx.getImageData(
      0,
      0,
      size,
      size
    ).data;

  const mask =
    new Uint8Array(
      size*size
    );

  for(let i=0;i<mask.length;i++){

    if(
      data[i*4+3] > 40
    ){

      mask[i] = 1;

    }

  }

  return mask;

}


function dilateMask(mask,size,tolerance){

  const out =
    new Uint8Array(
      mask.length
    );

  for(let y=0;y<size;y++){

    for(let x=0;x<size;x++){

      let found = false;

      for(
        let dy=-tolerance;
        dy<=tolerance && !found;
        dy++
      ){

        for(
          let dx=-tolerance;
          dx<=tolerance;
          dx++
        ){

          const nx = x+dx;
          const ny = y+dy;

          if(
            nx<0 ||
            ny<0 ||
            nx>=size ||
            ny>=size
          ){

            continue;

          }

          if(
            mask[ny*size+nx]
          ){

            found = true;

            break;

          }

        }

      }

      if(found){

        out[y*size+x] = 1;

      }

    }

  }

  return out;

}


function writingScore(char){

  const size = 100;

  const user =
    canvasMask();

  const target =
    makeTargetMask(char);

  /*
    Slight tolerance so handwriting doesn't have
    to perfectly overlap the font.
  */

  const tolerance = 6;

  const expandedUser =
    dilateMask(
      user,
      size,
      tolerance
    );

  const expandedTarget =
    dilateMask(
      target,
      size,
      tolerance
    );

  let userPixels = 0;
  let targetPixels = 0;

  let coveredTarget = 0;
  let acceptedUser = 0;

  for(let i=0;i<user.length;i++){

    if(user[i]){

      userPixels++;

      if(expandedTarget[i]){

        acceptedUser++;

      }

    }

    if(target[i]){

      targetPixels++;

      if(expandedUser[i]){

        coveredTarget++;

      }

    }

  }

  if(
    userPixels === 0 ||
    targetPixels === 0
  ){

    return 0;

  }

  const coverage =
    coveredTarget / targetPixels;

  const precision =
    acceptedUser / userPixels;

  /*
    Coverage is weighted more heavily because
    handwriting may extend outside the guide.
  */

  let score =
    coverage * 0.78 +
    precision * 0.22;

  /*
    Forgiveness bonuses.
  */

  if(coverage >= .50){

    score += .08;

  }

  if(coverage >= .70){

    score += .08;

  }

  return Math.min(
    1,
    score
  );

}


function checkWriting(){

  if(!currentWriteTarget){

    return;

  }

  const score =
    writingScore(
      currentWriteTarget.char
    );

  const percent =
    Math.round(score*100);

  const feedback =
    $("writeFeedback");

  if(percent >= 70){

    s.writing[
      currentWriteTarget.char
    ] =
      writeCount(
        currentWriteTarget.char
      ) + 1;

    feedback.textContent =
      `Great! ${percent}% — ${
        Math.min(
          3,
          writeCount(currentWriteTarget.char)
        )
      }/3`;

    feedback.className =
      "feedback good";

    /*
      If this was a combined syllable review,
      mark the source section as reviewed.
    */

    if(
      currentWriteTarget.sourceSection !== undefined
    ){

      s.tests[
        currentWriteTarget.sourceSection + "_review"
      ] = Date.now();

    }

    save();

  }else{

    feedback.textContent =
      `${percent}% — try again with the next character`;

    feedback.className =
      "feedback bad";

  }

  /*
    BOTH right and wrong advance.

    Right:
      count increases.

    Wrong:
      count stays the same.

    Either way:
      next random incomplete character.
  */

  setTimeout(()=>{

    feedback.textContent = "";

    feedback.className =
      "feedback";

    chooseNewWritingTarget();

  },1000);

}


/* =========================================================
   REVIEW
========================================================= */

function renderReview(){

  const content =
    $("reviewContent");

  let html = "";

  lessons.forEach((lesson,index)=>{

    if(!lessonUnlocked(index)) return;

    html += `

      <div style="
        padding:12px 0;
        border-bottom:1px solid #eee;
      ">

        <strong>
          ${index+1}. ${lesson.name}
        </strong>

        <br>

        <span style="color:#777">

          MC:
          ${lesson.items.filter(
            item=>practiceCount(item)>=3
          ).length}/${lesson.items.length}

          &nbsp; • &nbsp;

          Builds:
          ${lesson.items.filter(
            item=>buildCount(item)>=2
          ).length}/${lesson.items.length}

          &nbsp; • &nbsp;

          ${
            testPassed(index)
            ? "Test: ✅"
            : "Test: ⏳"
          }

        </span>

      </div>

    `;

  });

  if(!html){

    html = `
      <div class="empty">
        No lessons unlocked yet.
      </div>
    `;

  }

  content.innerHTML = html;

}


/* =========================================================
   SPEECH
========================================================= */

function speak(text){

  if(!("speechSynthesis" in window)){

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "ko-KR";

  utterance.rate = .8;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderLessons();

showTab("learn");

</script>
